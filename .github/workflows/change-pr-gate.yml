name: Change PR Gate

# Security boundary:
# pull_request_target loads this workflow from the PR base branch, not from
# the candidate branch. Candidate files are treated as data only; executable
# gate code always comes from the trusted base checkout.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  plan-risk-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Require same-repository PR
        shell: bash
        env:
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "Change PR Gate does not execute candidate content from forks."
            echo "head: $HEAD_REPO"
            echo "base: $BASE_REPO"
            exit 1
          fi

      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Checkout candidate as data
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Verify locked Plan precedes implementation
        id: plan
        shell: bash
        working-directory: candidate
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "$EVENT_BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$EVENT_BASE_SHA"
          fi

          mapfile -t LOCKS < <(
            git diff --name-only "$EVENT_BASE_SHA" HEAD -- .change-plans |
            grep -E '^\.change-plans/[a-z0-9][a-z0-9-]{2,80}/r[0-9]+\.lock\.json
          )

          if [ "${#LOCKS[@]}" -ne 1 ]; then
            echo "Expected exactly one changed Plan Lock in this PR; found ${#LOCKS[@]}."
            printf '%s\n' "${LOCKS[@]}"
            exit 1
          fi

          LOCK_FILE="${LOCKS[0]}"
          if [[ ! "$LOCK_FILE" =~ /r0\.lock\.json$ ]]; then
            echo "Change PR Gate v0.2 currently requires a fresh revision-0 Plan Lock."
            echo "If scope changes, restart the high-risk branch from the current base."
            exit 1
          fi

          LOCK_COMMIT="$(git log --reverse --format=%H --diff-filter=A "$EVENT_BASE_SHA..HEAD" -- "$LOCK_FILE" | head -n 1)"
          if [ -z "$LOCK_COMMIT" ]; then
            echo "Could not find the commit that added $LOCK_FILE."
            exit 1
          fi

          LOCK_PARENT="$(git rev-parse "$LOCK_COMMIT^")"
          if [ "$LOCK_PARENT" != "$EVENT_BASE_SHA" ]; then
            echo "Plan Lock was not the first branch commit from the current PR base."
            echo "base: $EVENT_BASE_SHA"
            echo "lock parent: $LOCK_PARENT"
            exit 1
          fi

          while IFS= read -r changed; do
            [ -z "$changed" ] && continue
            case "$changed" in
              .change-plans/*) ;;
              *)
                echo "The Plan Lock commit also changed implementation path: $changed"
                exit 1
                ;;
            esac
          done < <(git diff-tree --no-commit-id --name-only -r "$LOCK_COMMIT")

          if ! git diff --quiet "$LOCK_COMMIT" HEAD -- "$LOCK_FILE"; then
            echo "Plan Lock was modified after registration: $LOCK_FILE"
            exit 1
          fi

          LOCK_BASE="$(
            node - "$LOCK_FILE" <<'NODE'
          const fs = require('fs');
          const lockPath = process.argv[2];
          let lock;
          try {
            lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          } catch (error) {
            console.error('Plan Lock JSON parse failed: ' + error.message);
            process.exit(1);
          }
          if (!lock || !lock.plan || typeof lock.plan.baseSha !== 'string') {
            console.error('Plan Lock does not contain plan.baseSha');
            process.exit(1);
          }
          process.stdout.write(lock.plan.baseSha);
          NODE
          )"
          if [ "$LOCK_BASE" != "$EVENT_BASE_SHA" ]; then
            echo "Locked Plan baseSha does not equal current PR base."
            echo "locked: $LOCK_BASE"
            echo "base: $EVENT_BASE_SHA"
            exit 1
          fi

          echo "lock_file=$LOCK_FILE" >> "$GITHUB_OUTPUT"
          echo "lock_commit=$LOCK_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Require trusted gate implementation on base
        shell: bash
        working-directory: trusted
        run: |
          set -euo pipefail
          test -f tools/change-plan-lock.cjs
          test -f tools/change-scope-guard.cjs
          test -f tools/change-risk-check.cjs
          test -f tools/change-impact-check.cjs

      - name: Extract and verify locked Plan with trusted base
        shell: bash
        env:
          LOCK_FILE: ${{ steps.plan.outputs.lock_file }}
        run: |
          set -euo pipefail

          node "$GITHUB_WORKSPACE/trusted/tools/change-plan-lock.cjs" verify \
            --lock "$GITHUB_WORKSPACE/candidate/$LOCK_FILE"

          node - "$GITHUB_WORKSPACE/candidate/$LOCK_FILE" "$RUNNER_TEMP/yumaniwa-plan.json" <<'NODE'
          const fs=require('fs');
          const input=process.argv[2];
          const output=process.argv[3];
          const lock=JSON.parse(fs.readFileSync(input,'utf8'));
          fs.writeFileSync(output,JSON.stringify(lock.plan,null,2)+'\n');
          NODE

      - name: Scope Gate
        shell: bash
        run: |
          node "$GITHUB_WORKSPACE/trusted/tools/change-scope-guard.cjs" \
            --root "$GITHUB_WORKSPACE/candidate" \
            --plan "$RUNNER_TEMP/yumaniwa-plan.json" \
            --head HEAD

      - name: Risk Gate
        shell: bash
        run: |
          node "$GITHUB_WORKSPACE/trusted/tools/change-risk-check.cjs" \
            --root "$GITHUB_WORKSPACE/candidate" \
            --plan "$RUNNER_TEMP/yumaniwa-plan.json" \
            --head HEAD

      - name: Impact Gate
        shell: bash
        run: |
          node "$GITHUB_WORKSPACE/trusted/tools/change-impact-check.cjs" \
            --root "$GITHUB_WORKSPACE/candidate" \
            --plan "$RUNNER_TEMP/yumaniwa-plan.json" \
            --head HEAD

      - name: Gate summary
        shell: bash
        run: |
          echo "Plan Lock: ${{ steps.plan.outputs.lock_file }}"
          echo "Plan commit: ${{ steps.plan.outputs.lock_commit }}"
          echo "Gate implementation: trusted PR base"
          echo "Plan / Scope / Risk / Impact gates passed."
 || true
          )

          if [ "${#LOCKS[@]}" -ne 1 ]; then
            echo "Expected exactly one changed Plan Lock in this PR; found ${#LOCKS[@]}."
            printf '%s\n' "${LOCKS[@]}"
            exit 1
          fi

          LOCK_FILE="${LOCKS[0]}"
          if [[ ! "$LOCK_FILE" =~ /r0\.lock\.json$ ]]; then
            echo "Change PR Gate v0.2 currently requires a fresh revision-0 Plan Lock."
            echo "If scope changes, restart the high-risk branch from the current base."
            exit 1
          fi

          LOCK_COMMIT="$(git log --reverse --format=%H --diff-filter=A "$EVENT_BASE_SHA..HEAD" -- "$LOCK_FILE" | head -n 1)"
          if [ -z "$LOCK_COMMIT" ]; then
            echo "Could not find the commit that added $LOCK_FILE."
