name: Change Operations Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/YumaniwaDesk.py"
      - "tests/test_desk_repository.py"
      - "tests/test_scene_validation.py"
      - "tests/test_editor_session_desk.py"
      - "tools/change-scope-guard.cjs"
      - "tools/change-plan-lock.cjs"
      - "tools/change-risk-policy.cjs"
      - "tools/change-risk-check.cjs"
      - "tools/change-impact-rules.cjs"
      - "tools/change-impact-check.cjs"
      - "tools/change-verification-check.cjs"
      - "tools/change-static-check.cjs"
      - "tools/change-static-check-registry.json"
      - "tests/test-change-scope-guard.cjs"
      - "tests/test-change-plan-lock.cjs"
      - "tests/test-change-risk-check.cjs"
      - "tests/test-change-pr-gate.cjs"
      - "tests/test-change-impact-check.cjs"
      - "tests/test-change-verification-check.cjs"
      - "tests/test-change-static-check.cjs"
      - "CHANGE-PLAN.md"
      - "CHANGE-VERIFICATION.md"
      - "CHANGE-OPERATIONS.md"
      - "AGENTS.md"
      - "OPERATIONS.md"
      - ".github/workflows/change-operations-tests.yml"
      - ".github/workflows/change-pr-gate.yml"
      - ".github/workflows/change-verification.yml"
      - ".change-plans/**"
  pull_request:
    paths:
      - "tools/YumaniwaDesk.py"
      - "tests/test_desk_repository.py"
      - "tests/test_scene_validation.py"
      - "tests/test_editor_session_desk.py"
      - "tools/change-scope-guard.cjs"
      - "tools/change-plan-lock.cjs"
      - "tools/change-risk-policy.cjs"
      - "tools/change-risk-check.cjs"
      - "tools/change-impact-rules.cjs"
      - "tools/change-impact-check.cjs"
      - "tools/change-verification-check.cjs"
      - "tools/change-static-check.cjs"
      - "tools/change-static-check-registry.json"
      - "tests/test-change-scope-guard.cjs"
      - "tests/test-change-plan-lock.cjs"
      - "tests/test-change-risk-check.cjs"
      - "tests/test-change-pr-gate.cjs"
      - "tests/test-change-impact-check.cjs"
      - "tests/test-change-verification-check.cjs"
      - "tests/test-change-static-check.cjs"
      - "CHANGE-PLAN.md"
      - "CHANGE-VERIFICATION.md"
      - "CHANGE-OPERATIONS.md"
      - "AGENTS.md"
      - "OPERATIONS.md"
      - ".github/workflows/change-operations-tests.yml"
      - ".github/workflows/change-pr-gate.yml"
      - ".github/workflows/change-verification.yml"
      - ".change-plans/**"

permissions:
  contents: read

jobs:
  scope-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Change Operations syntax
        run: |
          node --check tools/change-scope-guard.cjs
          node --check tools/change-plan-lock.cjs
          node --check tools/change-risk-policy.cjs
          node --check tools/change-risk-check.cjs
          node --check tools/change-impact-rules.cjs
          node --check tools/change-impact-check.cjs
          node --check tools/change-verification-check.cjs
          node --check tools/change-static-check.cjs
          node --check tests/test-change-pr-gate.cjs
          node --check tests/test-change-static-check.cjs
          node -e "JSON.parse(require('fs').readFileSync('tools/change-static-check-registry.json','utf8'))"

      - name: Run Change Operations regression tests
        run: >
          node --test
          tests/test-change-scope-guard.cjs
          tests/test-change-plan-lock.cjs
          tests/test-change-risk-check.cjs
          tests/test-change-pr-gate.cjs
          tests/test-change-impact-check.cjs
          tests/test-change-verification-check.cjs
          tests/test-change-static-check.cjs

      - name: Run Desk repository and existing scene/session regressions
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
