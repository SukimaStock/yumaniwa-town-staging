name: Change Operations Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/change-scope-guard.cjs"
      - "tools/change-plan-lock.cjs"
      - "tools/change-risk-policy.cjs"
      - "tools/change-risk-check.cjs"
      - "tools/change-impact-rules.cjs"
      - "tools/change-impact-check.cjs"
      - "tools/change-verification-check.cjs"
      - "tools/change-provenance.cjs"
      - "tools/change-static-checks.cjs"
      - "tools/change-evidence-runner.cjs"
      - "tests/test-change-scope-guard.cjs"
      - "tests/test-change-plan-lock.cjs"
      - "tests/test-change-risk-check.cjs"
      - "tests/test-change-impact-check.cjs"
      - "tests/test-change-verification-check.cjs"
      - "tests/test-change-provenance.cjs"
      - "tests/test-change-evidence-runner.cjs"
      - "CHANGE-PLAN.md"
      - "CHANGE-VERIFICATION.md"
      - "CHANGE-OPERATIONS.md"
      - "AGENTS.md"
      - "OPERATIONS.md"
      - ".github/workflows/change-operations-tests.yml"
      - ".github/workflows/change-pr-gate.yml"
      - ".change-plans/**"
  pull_request:
    paths:
      - "tools/change-scope-guard.cjs"
      - "tools/change-plan-lock.cjs"
      - "tools/change-risk-policy.cjs"
      - "tools/change-risk-check.cjs"
      - "tools/change-impact-rules.cjs"
      - "tools/change-impact-check.cjs"
      - "tools/change-verification-check.cjs"
      - "tools/change-provenance.cjs"
      - "tools/change-static-checks.cjs"
      - "tools/change-evidence-runner.cjs"
      - "tests/test-change-scope-guard.cjs"
      - "tests/test-change-plan-lock.cjs"
      - "tests/test-change-risk-check.cjs"
      - "tests/test-change-impact-check.cjs"
      - "tests/test-change-verification-check.cjs"
      - "tests/test-change-provenance.cjs"
      - "tests/test-change-evidence-runner.cjs"
      - "CHANGE-PLAN.md"
      - "CHANGE-VERIFICATION.md"
      - "CHANGE-OPERATIONS.md"
      - "AGENTS.md"
      - "OPERATIONS.md"
      - ".github/workflows/change-operations-tests.yml"
      - ".github/workflows/change-pr-gate.yml"
      - ".change-plans/**"

permissions:
  contents: read

jobs:
  scope-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Change Operations syntax
        run: |
          node --check tools/change-scope-guard.cjs
          node --check tools/change-plan-lock.cjs
          node --check tools/change-risk-policy.cjs
          node --check tools/change-risk-check.cjs
          node --check tools/change-impact-rules.cjs
          node --check tools/change-impact-check.cjs
          node --check tools/change-verification-check.cjs
          node --check tools/change-provenance.cjs
          node --check tools/change-static-checks.cjs
          node --check tools/change-evidence-runner.cjs

      - name: Run Change Operations regression tests
        run: >
          node --test
          tests/test-change-scope-guard.cjs
          tests/test-change-plan-lock.cjs
          tests/test-change-risk-check.cjs
          tests/test-change-impact-check.cjs
          tests/test-change-verification-check.cjs
          tests/test-change-provenance.cjs
          tests/test-change-evidence-runner.cjs
