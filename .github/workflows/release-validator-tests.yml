name: Release Validator Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "data/works.js"
      - "data/work-search-meta.js"
      - "data/work-guide-meta.js"
      - "work-guide-terminal.js"
      - "work-guide-terminal.css"
      - "town-interaction-flow.js"
      - "main.js"
      - "tests/test-work-guide.cjs"
      - "data/updates.js"
      - "data/ghost-dialogue.js"
      - "w/**"
      - "en/w/**"
      - "assets/works/**"
      - "work-install-meta.js"
      - "sitemap.xml"
      - "tools/release-validator.cjs"
      - "tools/generate-work-search-pages.cjs"
      - "tests/test-release-validator.cjs"
      - "tests/fixtures/release/**"
      - "RELEASE-WORKFLOW.md"
      - "OPERATIONS.md"
      - ".github/workflows/release-validator-tests.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run release validator and guide regression tests
        run: node --test tests/test-release-validator.cjs tests/test-work-guide.cjs

      - name: Verify generated Search / Share v2 pages
        run: >
          node tools/generate-work-search-pages.cjs
          --env staging
          --published orbit,diorama-calendar,rojiura-masala,steamclock,dotweather,junkissa-dive,midnight-cola,yakitori-wars,rainy-window
          --check

      - name: Validate current published Search / Share release set
        run: >
          node tools/release-validator.cjs
          --env staging
          --ids orbit,diorama-calendar,rojiura-masala,steamclock,dotweather,junkissa-dive,midnight-cola,yakitori-wars,rainy-window
          --published orbit,diorama-calendar,rojiura-masala,steamclock,dotweather,junkissa-dive,midnight-cola,yakitori-wars,rainy-window

      - name: Validate town awareness for all open staging works
        run: |
          node - <<'NODE'
          const {
            readWorks,
            readTownReleaseSignals,
          } = require('./tools/release-validator.cjs');

          const works = readWorks('.').filter(
            (work) => work && work.status === 'open'
          );
          const signals = readTownReleaseSignals('.');
          const failures = [];

          for (const work of works) {
            const update = signals.updates.find(
              (entry) =>
                entry &&
                Array.isArray(entry.workIds) &&
                entry.workIds.includes(work.id) &&
                typeof entry.date === 'string' &&
                entry.date.trim() &&
                typeof entry.title === 'string' &&
                entry.title.trim() &&
                typeof entry.body === 'string' &&
                entry.body.trim()
            );
            if (!update) {
              failures.push(
                work.id + ': missing data/updates.js workIds-linked release record'
              );
            }

            const lines = signals.ghostWorks[work.id];
            if (
              !Array.isArray(lines) ||
              !lines.some(
                (line) => typeof line === 'string' && line.trim()
              )
            ) {
              failures.push(
                work.id + ': missing data/ghost-dialogue.js works[id] dialogue'
              );
            }
          }

          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }

          console.log(
            'Town awareness OK: ' + works.map((work) => work.id).join(', ')
          );
          NODE
