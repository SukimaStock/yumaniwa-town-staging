name: Temporary Search Share v2 Generation

on:
  push:
    branches: [main]
    paths:
      - "tools/generate-work-search-pages.cjs"
      - ".github/workflows/search-share-v2-generate.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate staging Search / Share v2
        run: >
          node tools/generate-work-search-pages.cjs
          --env staging
          --published orbit,diorama-calendar,rojiura-masala,steamclock,dotweather,junkissa-dive,midnight-cola,yakitori-wars,rainy-window
          --write

      - name: Verify deterministic output
        run: >
          node tools/generate-work-search-pages.cjs
          --env staging
          --published orbit,diorama-calendar,rojiura-masala,steamclock,dotweather,junkissa-dive,midnight-cola,yakitori-wars,rainy-window
          --check

      - name: Commit generated staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add w en/w sitemap.xml
          if git diff --cached --quiet; then
            echo "Generated files already current."
            exit 0
          fi
          git commit -m "Search: refresh multilingual generated pages"
          git push origin HEAD:main
