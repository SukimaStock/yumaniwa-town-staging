name: Change Verification Evidence

# Phase C3-2 trust boundary:
# pull_request_target loads this workflow from the PR base branch.
# Candidate repository content is inspected as data only. This workflow emits
# trusted mechanical + trusted static evidence but MUST NOT claim final VERIFIED
# until authenticated human attestation and final evidence integration are added.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  trusted-mechanical-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Require same-repository PR
        shell: bash
        env:
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "Trusted verification does not inspect candidate content from forks."
            exit 1
          fi

      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Checkout candidate as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Resolve immutable Plan Lock
        id: plan
        shell: bash
        working-directory: candidate
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$EVENT_BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$EVENT_BASE_SHA"
          fi

          mapfile -t LOCKS < <(
            git diff --name-only "$EVENT_BASE_SHA" HEAD -- .change-plans |
            grep -E '^\.change-plans/[a-z0-9][a-z0-9-]{2,80}/r[0-9]+\.lock\.json$' || true
          )
          if [ "${#LOCKS[@]}" -ne 1 ]; then
            echo "Expected exactly one changed Plan Lock; found ${#LOCKS[@]}."
            exit 1
          fi

          LOCK_FILE="${LOCKS[0]}"
          if [[ ! "$LOCK_FILE" =~ /r0\.lock\.json$ ]]; then
            echo "C3-1 trusted evidence requires a fresh revision-0 Plan Lock."
            exit 1
          fi

          LOCK_COMMIT="$(git log --reverse --format=%H --diff-filter=A "$EVENT_BASE_SHA..HEAD" -- "$LOCK_FILE" | head -n 1)"
          [ -n "$LOCK_COMMIT" ] || { echo "Could not find Plan Lock add commit."; exit 1; }
          LOCK_PARENT="$(git rev-parse "$LOCK_COMMIT^")"
          [ "$LOCK_PARENT" = "$EVENT_BASE_SHA" ] || { echo "Plan Lock was not the first branch commit."; exit 1; }

          while IFS= read -r commit; do
            [ -z "$commit" ] && continue
            git merge-base --is-ancestor "$LOCK_COMMIT" "$commit" || {
              echo "Commit $commit is not descended from the Plan Lock commit $LOCK_COMMIT."
              exit 1
            }
          done < <(git rev-list "$EVENT_BASE_SHA..HEAD")

          while IFS= read -r changed; do
            [ -z "$changed" ] && continue
            [ "$changed" = "$LOCK_FILE" ] || { echo "Plan Lock commit contains an unexpected path; value omitted from trusted log."; exit 1; }
          done < <(git diff-tree --no-commit-id --name-only -r "$LOCK_COMMIT")

          git diff --quiet "$LOCK_COMMIT" HEAD -- "$LOCK_FILE" || { echo "Plan Lock changed after registration."; exit 1; }

          LOCK_ENTRY="$(git ls-tree "$LOCK_COMMIT" -- "$LOCK_FILE")"
          [ -n "$LOCK_ENTRY" ] || { echo "Plan Lock tree entry is missing."; exit 1; }
          read -r LOCK_MODE LOCK_TYPE LOCK_OID LOCK_TREE_PATH <<< "$LOCK_ENTRY"
          [ "$LOCK_MODE" = "100644" ] || { echo "Plan Lock must be a non-executable regular Git file; found mode $LOCK_MODE."; exit 1; }
          [ "$LOCK_TYPE" = "blob" ] || { echo "Plan Lock must be stored as a Git blob; found type $LOCK_TYPE."; exit 1; }

          IMMUTABLE_LOCK="$RUNNER_TEMP/yumaniwa-plan-lock.json"
          git cat-file blob "$LOCK_OID" > "$IMMUTABLE_LOCK"

          LOCK_BASE="$(node - "$IMMUTABLE_LOCK" <<'NODE'
          const fs=require('fs');
          const lockPath=process.argv[2];
          let lock;
          try {
            lock=JSON.parse(fs.readFileSync(lockPath,'utf8'));
          } catch {
            console.error('Plan Lock JSON parse failed.');
            process.exit(2);
          }
          if(!lock || !lock.plan || typeof lock.plan.baseSha!=='string') {
            console.error('Plan Lock does not contain plan.baseSha.');
            process.exit(2);
          }
          process.stdout.write(lock.plan.baseSha);
          NODE
          )"
          [ "$LOCK_BASE" = "$EVENT_BASE_SHA" ] || { echo "Plan baseSha does not equal current PR base."; exit 1; }

          echo "lock_file=$LOCK_FILE" >> "$GITHUB_OUTPUT"
          echo "lock_commit=$LOCK_COMMIT" >> "$GITHUB_OUTPUT"
          echo "lock_blob=$LOCK_OID" >> "$GITHUB_OUTPUT"

      - name: Verify Plan Lock with trusted base
        shell: bash
        run: |
          set -euo pipefail
          IMMUTABLE_LOCK="$RUNNER_TEMP/yumaniwa-plan-lock.json"
          node "$GITHUB_WORKSPACE/trusted/tools/change-plan-lock.cjs" verify \
            --lock "$IMMUTABLE_LOCK"
          node - "$IMMUTABLE_LOCK" "$RUNNER_TEMP/yumaniwa-plan.json" <<'NODE'
          const fs=require('fs');
          const lock=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          fs.writeFileSync(process.argv[3],JSON.stringify(lock.plan,null,2)+'\n');
          NODE

      - name: Collect trusted Scope evidence
        id: scope
        shell: bash
        run: |
          set -u -o pipefail
          set +e
          node "$GITHUB_WORKSPACE/trusted/tools/change-scope-guard.cjs" \
            --root "$GITHUB_WORKSPACE/candidate" \
            --plan "$RUNNER_TEMP/yumaniwa-plan.json" \
            --head HEAD --json > "$RUNNER_TEMP/scope.json" 2> "$RUNNER_TEMP/scope.stderr"
          STATUS=$?
          set -e
          if [ ! -s "$RUNNER_TEMP/scope.json" ]; then
            node - "$STATUS" "$RUNNER_TEMP/scope.stderr" "$RUNNER_TEMP/scope.json" <<'NODE'
          const fs=require('fs');
          const [status,stderrPath,outPath]=process.argv.slice(2);
          const stderr=fs.existsSync(stderrPath)?fs.readFileSync(stderrPath,'utf8').trim():'';
          fs.writeFileSync(outPath,JSON.stringify({
            schema:'yumaniwa-gate-error/0.1',
            gate:'scope',
            exitCode:Number(status),
            error:stderr || 'scope gate produced no JSON report'
          },null,2)+'\n');
          NODE
          fi
          echo "Trusted Scope JSON evidence captured."
          if [ -s "$RUNNER_TEMP/scope.stderr" ]; then cat "$RUNNER_TEMP/scope.stderr" >&2; fi
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Collect trusted Risk evidence
        id: risk
        shell: bash
        run: |
          set -u -o pipefail
          set +e
          node "$GITHUB_WORKSPACE/trusted/tools/change-risk-check.cjs" \
            --root "$GITHUB_WORKSPACE/candidate" \
            --plan "$RUNNER_TEMP/yumaniwa-plan.json" \
            --head HEAD --json > "$RUNNER_TEMP/risk.json" 2> "$RUNNER_TEMP/risk.stderr"
          STATUS=$?
          set -e
          if [ ! -s "$RUNNER_TEMP/risk.json" ]; then
            node - "$STATUS" "$RUNNER_TEMP/risk.stderr" "$RUNNER_TEMP/risk.json" <<'NODE'
          const fs=require('fs');
          const [status,stderrPath,outPath]=process.argv.slice(2);
          const stderr=fs.existsSync(stderrPath)?fs.readFileSync(stderrPath,'utf8').trim():'';
          fs.writeFileSync(outPath,JSON.stringify({
            schema:'yumaniwa-gate-error/0.1',
            gate:'risk',
            exitCode:Number(status),
            error:stderr || 'risk gate produced no JSON report'
          },null,2)+'\n');
          NODE
          fi
          echo "Trusted Risk JSON evidence captured."
          if [ -s "$RUNNER_TEMP/risk.stderr" ]; then cat "$RUNNER_TEMP/risk.stderr" >&2; fi
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Collect trusted Impact evidence
        id: impact
        shell: bash
        run: |
          set -u -o pipefail
          set +e
          node "$GITHUB_WORKSPACE/trusted/tools/change-impact-check.cjs" \
            --root "$GITHUB_WORKSPACE/candidate" \
            --plan "$RUNNER_TEMP/yumaniwa-plan.json" \
            --head HEAD --json > "$RUNNER_TEMP/impact.json" 2> "$RUNNER_TEMP/impact.stderr"
          STATUS=$?
          set -e
          if [ ! -s "$RUNNER_TEMP/impact.json" ]; then
            node - "$STATUS" "$RUNNER_TEMP/impact.stderr" "$RUNNER_TEMP/impact.json" <<'NODE'
          const fs=require('fs');
          const [status,stderrPath,outPath]=process.argv.slice(2);
          const stderr=fs.existsSync(stderrPath)?fs.readFileSync(stderrPath,'utf8').trim():'';
          fs.writeFileSync(outPath,JSON.stringify({
            schema:'yumaniwa-gate-error/0.1',
            gate:'impact',
            exitCode:Number(status),
            error:stderr || 'impact gate produced no JSON report'
          },null,2)+'\n');
          NODE
          fi
          echo "Trusted Impact JSON evidence captured."
          if [ -s "$RUNNER_TEMP/impact.stderr" ]; then cat "$RUNNER_TEMP/impact.stderr" >&2; fi
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Resolve trusted static definition blobs
        id: static_sources
        shell: bash
        working-directory: trusted
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          registry_entry="$(git ls-tree "$BASE_SHA" -- tools/change-static-check-registry.json)"
          [ -n "$registry_entry" ] || { echo "Trusted static registry is missing from PR base."; exit 1; }
          read -r registry_mode registry_type registry_blob registry_path <<< "$registry_entry"
          [ "$registry_mode" = "100644" ] || { echo "Trusted static registry must be a non-executable regular Git file."; exit 1; }
          [ "$registry_type" = "blob" ] || { echo "Trusted static registry must be stored as a Git blob."; exit 1; }

          risk_entry="$(git ls-tree "$BASE_SHA" -- tools/change-risk-policy.cjs)"
          [ -n "$risk_entry" ] || { echo "Trusted Risk Policy is missing from PR base."; exit 1; }
          read -r risk_mode risk_type risk_blob risk_path <<< "$risk_entry"
          [ "$risk_mode" = "100644" ] || { echo "Trusted Risk Policy must be a non-executable regular Git file."; exit 1; }
          [ "$risk_type" = "blob" ] || { echo "Trusted Risk Policy must be stored as a Git blob."; exit 1; }

          executor_entry="$(git ls-tree "$BASE_SHA" -- tools/change-static-check.cjs)"
          [ -n "$executor_entry" ] || { echo "Trusted Static executor is missing from PR base."; exit 1; }
          read -r executor_mode executor_type executor_blob executor_path <<< "$executor_entry"
          [ "$executor_mode" = "100644" ] || { echo "Trusted Static executor must be a non-executable regular Git file."; exit 1; }
          [ "$executor_type" = "blob" ] || { echo "Trusted Static executor must be stored as a Git blob."; exit 1; }

          echo "registry_blob=$registry_blob" >> "$GITHUB_OUTPUT"
          echo "risk_policy_blob=$risk_blob" >> "$GITHUB_OUTPUT"
          echo "executor_blob=$executor_blob" >> "$GITHUB_OUTPUT"

      - name: Collect trusted Static evidence
        id: static
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY_BLOB: ${{ steps.static_sources.outputs.registry_blob }}
          RISK_POLICY_BLOB: ${{ steps.static_sources.outputs.risk_policy_blob }}
          EXECUTOR_BLOB: ${{ steps.static_sources.outputs.executor_blob }}
        run: |
          set -u -o pipefail
          set +e
          node "$GITHUB_WORKSPACE/trusted/tools/change-static-check.cjs" \
            --root "$GITHUB_WORKSPACE/candidate" \
            --plan "$RUNNER_TEMP/yumaniwa-plan.json" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --repository "$REPOSITORY" \
            --registry-blob "$REGISTRY_BLOB" \
            --risk-policy-blob "$RISK_POLICY_BLOB" \
            --executor-blob "$EXECUTOR_BLOB" \
            --json > "$RUNNER_TEMP/static.json" 2> "$RUNNER_TEMP/static.stderr"
          STATUS=$?
          set -e

          if [ ! -s "$RUNNER_TEMP/static.json" ]; then
            node - "$STATUS" "$RUNNER_TEMP/static.stderr" "$RUNNER_TEMP/static.json" <<'NODE'
          const crypto=require('crypto');
          const fs=require('fs');
          const [status,stderrPath,outPath]=process.argv.slice(2);
          const stderr=fs.existsSync(stderrPath)?fs.readFileSync(stderrPath):Buffer.alloc(0);
          fs.writeFileSync(outPath,JSON.stringify({
            schema:'yumaniwa-gate-error/0.1',
            gate:'static',
            exitCode:Number(status),
            diagnosticBytes:stderr.length,
            diagnosticSha256:stderr.length?crypto.createHash('sha256').update(stderr).digest('hex'):null,
            error:'trusted static executor produced no JSON report'
          },null,2)+'\n');
          NODE
          fi

          echo "Trusted Static JSON evidence captured."
          if [ -s "$RUNNER_TEMP/static.stderr" ]; then
            echo "Trusted Static stderr was captured privately; raw content omitted from operator log."
          fi
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Build exact-SHA trusted evidence envelope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          LOCK_FILE: ${{ steps.plan.outputs.lock_file }}
          LOCK_COMMIT: ${{ steps.plan.outputs.lock_commit }}
          LOCK_BLOB: ${{ steps.plan.outputs.lock_blob }}
          SCOPE_EXIT: ${{ steps.scope.outputs.exit_code }}
          RISK_EXIT: ${{ steps.risk.outputs.exit_code }}
          IMPACT_EXIT: ${{ steps.impact.outputs.exit_code }}
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/scope.json" "$RUNNER_TEMP/risk.json" "$RUNNER_TEMP/impact.json" "$RUNNER_TEMP/trusted-evidence.json" <<'NODE'
          const fs=require('fs');
          const [scopePath,riskPath,impactPath,outPath]=process.argv.slice(2);
          const scope=JSON.parse(fs.readFileSync(scopePath,'utf8'));
          const risk=JSON.parse(fs.readFileSync(riskPath,'utf8'));
          const impact=JSON.parse(fs.readFileSync(impactPath,'utf8'));
          const evidence={
            schema:'yumaniwa-trusted-mechanical-evidence/0.1',
            trustBoundary:'pull_request_target:base-owned',
            repository:process.env.REPOSITORY,
            baseSha:process.env.BASE_SHA,
            targetSha:process.env.HEAD_SHA,
            planLock:{path:process.env.LOCK_FILE,commit:process.env.LOCK_COMMIT,blob:process.env.LOCK_BLOB},
            producer:{
              actor:process.env.ACTOR,
              triggeringActor:process.env.TRIGGERING_ACTOR,
              runId:process.env.RUN_ID,
              runAttempt:process.env.RUN_ATTEMPT,
              workflowRef:process.env.WORKFLOW_REF,
              workflowSha:process.env.WORKFLOW_SHA
            },
            gateExitCodes:{
              scope:Number(process.env.SCOPE_EXIT),
              risk:Number(process.env.RISK_EXIT),
              impact:Number(process.env.IMPACT_EXIT)
            },
            checks:{scope,risk,impact},
            verificationState:'UNVERIFIED',
            limitation:'C3-1 trusted mechanical evidence. C3-2 trusted static evidence is emitted separately; authenticated human attestation and final VERIFIED are not implemented yet.'
          };
          fs.writeFileSync(outPath,JSON.stringify(evidence,null,2)+'\n');
          NODE

      - name: Upload trusted mechanical evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-mechanical-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Build exact-SHA trusted static evidence envelope
        id: static_envelope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          LOCK_FILE: ${{ steps.plan.outputs.lock_file }}
          LOCK_COMMIT: ${{ steps.plan.outputs.lock_commit }}
          LOCK_BLOB: ${{ steps.plan.outputs.lock_blob }}
          REGISTRY_BLOB: ${{ steps.static_sources.outputs.registry_blob }}
          RISK_POLICY_BLOB: ${{ steps.static_sources.outputs.risk_policy_blob }}
          EXECUTOR_BLOB: ${{ steps.static_sources.outputs.executor_blob }}
          STATIC_EXIT: ${{ steps.static.outputs.exit_code }}
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/static.json" "$RUNNER_TEMP/trusted-static-evidence.json" "$RUNNER_TEMP/static-envelope-exit.txt" <<'NODE'
          const fs=require('fs');
          const [staticPath,outPath,statusPath]=process.argv.slice(2);
          const staticChecks=JSON.parse(fs.readFileSync(staticPath,'utf8'));
          const validationErrors=[];

          if(staticChecks.schema==='yumaniwa-trusted-static-check-report/0.1') {
            if(staticChecks.repository!==process.env.REPOSITORY ||
               staticChecks.baseSha!==process.env.BASE_SHA ||
               staticChecks.targetSha!==process.env.HEAD_SHA) {
              validationErrors.push('REPORT_IDENTITY_MISMATCH');
            }
            if(!staticChecks.sourceProvenance ||
               !staticChecks.sourceProvenance.registry ||
               staticChecks.sourceProvenance.registry.blob!==process.env.REGISTRY_BLOB ||
               !staticChecks.sourceProvenance.riskPolicy ||
               staticChecks.sourceProvenance.riskPolicy.blob!==process.env.RISK_POLICY_BLOB ||
               !staticChecks.sourceProvenance.executor ||
               staticChecks.sourceProvenance.executor.blob!==process.env.EXECUTOR_BLOB) {
              validationErrors.push('TRUSTED_SOURCE_PROVENANCE_MISMATCH');
            }
          } else if(staticChecks.schema!=='yumaniwa-gate-error/0.1') {
            validationErrors.push('UNEXPECTED_STATIC_REPORT_SCHEMA');
          }

          const evidence={
            schema:'yumaniwa-trusted-static-evidence/0.1',
            trustBoundary:'pull_request_target:base-owned',
            repository:process.env.REPOSITORY,
            baseSha:process.env.BASE_SHA,
            targetSha:process.env.HEAD_SHA,
            planLock:{path:process.env.LOCK_FILE,commit:process.env.LOCK_COMMIT,blob:process.env.LOCK_BLOB},
            producer:{
              actor:process.env.ACTOR,
              triggeringActor:process.env.TRIGGERING_ACTOR,
              runId:process.env.RUN_ID,
              runAttempt:process.env.RUN_ATTEMPT,
              workflowRef:process.env.WORKFLOW_REF,
              workflowSha:process.env.WORKFLOW_SHA
            },
            trustedSources:{
              registry:{
                path:'tools/change-static-check-registry.json',
                blob:process.env.REGISTRY_BLOB,
                schema:staticChecks.sourceProvenance && staticChecks.sourceProvenance.registry && staticChecks.sourceProvenance.registry.schema || null,
                version:staticChecks.sourceProvenance && staticChecks.sourceProvenance.registry && staticChecks.sourceProvenance.registry.version || null
              },
              riskPolicy:{path:'tools/change-risk-policy.cjs',blob:process.env.RISK_POLICY_BLOB},
              executor:{path:'tools/change-static-check.cjs',blob:process.env.EXECUTOR_BLOB}
            },
            envelopeValidation:{
              status:validationErrors.length?'FAIL':'PASS',
              errors:validationErrors
            },
            staticExitCode:Number(process.env.STATIC_EXIT),
            checks:staticChecks,
            verificationState:'UNVERIFIED',
            limitation:'C3-2 trusted static evidence only; authenticated human attestation and final VERIFIED are intentionally not implemented.'
          };
          fs.writeFileSync(outPath,JSON.stringify(evidence,null,2)+'\n');
          fs.writeFileSync(statusPath,validationErrors.length?'1\n':'0\n');
          NODE
          ENVELOPE_EXIT="$(cat "$RUNNER_TEMP/static-envelope-exit.txt")"
          echo "exit_code=$ENVELOPE_EXIT" >> "$GITHUB_OUTPUT"
          if [ "$ENVELOPE_EXIT" != "0" ]; then
            echo "Trusted Static envelope validation failed; evidence preserved for inspection."
          fi

      - name: Upload trusted static evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-static-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted-static-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail after preserving trusted evidence
        shell: bash
        env:
          SCOPE_EXIT: ${{ steps.scope.outputs.exit_code }}
          RISK_EXIT: ${{ steps.risk.outputs.exit_code }}
          IMPACT_EXIT: ${{ steps.impact.outputs.exit_code }}
          STATIC_EXIT: ${{ steps.static.outputs.exit_code }}
          STATIC_ENVELOPE_EXIT: ${{ steps.static_envelope.outputs.exit_code }}
        run: |
          set -euo pipefail
          echo "Trusted mechanical and static evidence collected for ${{ github.event.pull_request.head.sha }}."
          echo "C3-2 does not declare final VERIFIED."
          if [ "$SCOPE_EXIT" != "0" ] || [ "$RISK_EXIT" != "0" ] || [ "$IMPACT_EXIT" != "0" ] || [ "$STATIC_EXIT" != "0" ] || [ "$STATIC_ENVELOPE_EXIT" != "0" ]; then
            echo "One or more trusted gates failed: scope=$SCOPE_EXIT risk=$RISK_EXIT impact=$IMPACT_EXIT static=$STATIC_EXIT staticEnvelope=$STATIC_ENVELOPE_EXIT"
            exit 1
          fi

# C3-2 self-authorization canary: candidate changed contracted workflow.
