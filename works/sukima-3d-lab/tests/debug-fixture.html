<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Touch Lab v0.2 · Debug UI fixture</title><link rel="stylesheet" href="../style.css?v=0.2.1">
<main><header><p>DEVELOPER TEST</p><h1>Debug UI fixture <span>0.2</span></h1><p>WebGLを使わない操作UIのテストです。</p></header><output id="fixture-state" style="position:absolute;left:28px;top:140px;font-size:12px"></output></main>
<script type="module">
import {createPolyhedron} from '../engine/geometry.js?v=0.2.1';
import {TouchBody} from '../engine/dynamics.js?v=0.2.1';
import {createDebugPanel} from '../debug.js?v=0.2.1';
const body=new TouchBody(createPolyhedron()),panel=createDebugPanel(body,{cancel(){}},document.querySelector('main'));
const output=document.querySelector('#fixture-state');
function frame(){panel.update();output.textContent=`Material ${body.feel}; depth ${body.options.depth.toFixed(3)}; tap ${body.options.tapImpulse.toFixed(1)}`;requestAnimationFrame(frame);}frame();
</script></html>
