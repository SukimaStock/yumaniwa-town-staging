<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Touch Lab v0.5 · Input / Debug UI fixture</title><link rel="stylesheet" href="../style.css?v=0.7.0">
<main style="-webkit-touch-callout:none;-webkit-user-select:none;user-select:none"><header><p>DEVELOPER TEST</p><h1>Input / Debug UI fixture <span>0.5</span></h1><p>WebGLを使わない操作UIのテストです。</p>
<label style="pointer-events:auto;font-size:12px">展示物 <select id="fixture-specimen" aria-label="検証する展示物"></select></label><button id="fixture-reset" type="button" style="pointer-events:auto">初期姿勢</button></header>
<output id="fixture-state" style="position:absolute;left:28px;top:180px;font-size:12px;white-space:pre-line"></output>
<div id="input-surface" tabindex="0" role="region" aria-label="入力テスト領域" style="position:absolute;left:28px;top:275px;width:min(460px,55vw);height:260px;border:1px solid #b9ad9f;touch-action:none;user-select:none">入力テスト領域（3D描画なし）</div><div id="fixture-debug"></div></main>
<script type="module">
import {pickMesh} from '../engine/geometry.js?v=0.7.0';
import {SpecimenSession} from '../engine/session.js?v=0.7.0';
import {Camera} from '../engine/camera.js?v=0.7.0';
import {PointerInput} from '../engine/interaction.js?v=0.7.0';
import {createDebugPanel} from '../debug.js?v=0.7.0';
import {loadCollection} from '../collection.js?v=0.7.0';
const session=new SpecimenSession(),camera=new Camera(),surface=document.querySelector('#input-surface'),host=document.querySelector('#fixture-debug'),choice=document.querySelector('#fixture-specimen'),output=document.querySelector('#fixture-state');
let body,input,panel,last=null,peak=0,lastMode='idle';
const items=(await loadCollection(new URL('../',import.meta.url))).filter(i=>i.definition);
for(const [index,item] of items.entries()){const option=document.createElement('option');option.value=index;option.textContent=`${String(item.number??item.index).padStart(2,'0')} / ${item.definition.name}`;choice.append(option);}
// Every point in this labelled 2D fixture selects the centre ray. This tests
// real browser pointer capture/state, not pointer/3D alignment or GL rendering.
const pick=()=>{const r=surface.getBoundingClientRect();camera.resize(r.width,r.height,session.mesh.radius);const ray=camera.ray(r.left+r.width/2,r.top+r.height/2,r,body.pose());return pickMesh(body.mesh,ray.origin,ray.direction);};
function select(){
 input?.destroy();session.select(items[Number(choice.value)].definition);body=session.body;peak=0;lastMode='idle';host.replaceChildren();
 input=new PointerInput(surface,body,pick,()=>{},(x,y,q,p)=>camera.pullMapping(x,y,surface.getBoundingClientRect(),q,p));
 panel=body.touchEnabled?createDebugPanel(body,input,host):null;
}
choice.addEventListener('change',select);select();
document.querySelector('#fixture-reset').addEventListener('click',()=>{input.cancel();body.resetPose(session.definition.display.orientation);});
function frame(now){
 const dt=last===null?0:Math.min(.05,(now-last)/1000);last=now;input.step(dt);body.step(dt);panel?.update();
 const offset=body.offsets?Math.max(...body.offsets.map(v=>Math.hypot(...v))):0;peak=Math.max(peak,offset);if(input.pointer)lastMode=input.pointer.mode;
 output.textContent=`${body.touchEnabled?'Material '+body.feel:'STATIC'}; ${session.definition.name}${body.touchEnabled?`; depth ${body.options.depth.toFixed(3)}; hold ${body.options.holdDelay} ms; max ${body.options.maxPull.toFixed(2)}`:''}\nmode ${input.pointer?.mode??'idle'}; last ${lastMode}; offset ${offset.toFixed(4)}; peak ${peak.toFixed(4)}; spin ${Math.hypot(...body.velocity).toFixed(2)}\npose ${body.pose().map(n=>n.toFixed(3)).join(' / ')}`;
 requestAnimationFrame(frame);
}
const cancel=()=>{input.cancel();body.cancel();};
window.addEventListener('blur',cancel);window.addEventListener('pagehide',cancel);window.addEventListener('resize',cancel);document.addEventListener('visibilitychange',()=>{if(document.hidden)cancel();});
requestAnimationFrame(frame);
</script></html>
