<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hands-on · CPU / picking / input fixture</title>
<link rel="stylesheet" href="../style.css?v=0.7.0">
<style>body{overflow:auto;padding:18px}h1{font-size:17px}p{font-size:12px}#controls{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}#surface{position:relative;width:min(100%,420px);height:420px;background:#f5f1e8;border:1px solid #d7cdbf}#part-canvas{width:100%;height:100%}#grab-marker{position:absolute;pointer-events:none;color:#745e47;font-size:18px;transform:translate(-50%,-50%)}output{display:block;white-space:pre-line;font-size:12px;line-height:1.7;margin-top:12px}.debug{position:static;margin:15px 0}</style>
<h1>Hands-on · 指とパーツの検証</h1><p>CPU描画。実際のPicking・PointerInput・軸変換を使用。WebGLや実機性能の検証ではありません。＋は検証用の操作点です。</p>
<div id="controls"><label for="object">作品</label><select id="object"></select><button id="reset" type="button">初期姿勢</button><button id="reopen" type="button">開き直す</button></div>
<div id="surface"><canvas id="part-canvas" width="200" height="200" tabindex="0" aria-label="パーツをつかむ検証面"></canvas><span id="grab-marker" aria-label="操作点">＋</span></div>
<output id="part-state" role="status">読み込み中</output><div id="debug-host"></div>
<script type="module">
import {SpecimenSession} from '../engine/session.js?v=0.7.0';
import {loadCollection} from '../collection.js?v=0.7.0';
import {PointerInput} from '../engine/interaction.js?v=0.7.0';
import {Camera} from '../engine/camera.js?v=0.7.0';
import {AnimationLoop} from '../engine/loop.js?v=0.7.0';
import {rasterMesh} from '../engine/raster.js?v=0.7.0';
import {manipulationMapping} from '../engine/manipulation-mapping.js?v=0.7.0';
import {createManipulationPanel} from '../manipulation-debug.js?v=0.7.0';
import {add,scale,rotate,norm,sub} from '../engine/math.js?v=0.7.0';
const session=new SpecimenSession(),camera=new Camera(),canvas=document.querySelector('#part-canvas'),ctx=canvas.getContext('2d'),output=document.querySelector('#part-state'),marker=document.querySelector('#grab-marker'),select=document.querySelector('#object'),host=document.querySelector('#debug-host');
let input,debug,original,lastDraw=0;
const items=(await loadCollection(new URL('../',location.href))).filter(i=>i.definition?.behaviors?.manipulation);
for(const item of items){const o=document.createElement('option');o.value=item.id;o.textContent=`${item.number} / ${item.definition.name}`;select.append(o);}
const pick=(x,y)=>{const r=camera.ray(x,y,canvas.getBoundingClientRect(),session.body.pose());return session.assembly.pick(r.origin,r.direction);};
function resize(){input?.cancel();session.manipulation?.cancel();const r=canvas.getBoundingClientRect();camera.resize(r.width,r.height,session.assembly.radius);draw();}
function show(){input?.destroy();host.replaceChildren();session.select(items.find(i=>i.id===select.value).definition);original=JSON.stringify(session.mesh.vertices);input=new PointerInput(canvas,session.body,pick,()=>{},null,{controller:session.manipulation,map:(hit,x,y,rect,view)=>manipulationMapping(session.manipulation,hit,x,y,rect,view,camera)});debug=createManipulationPanel(session.manipulation,input,host,resize);resize();}
function draw(){
 const p=session.manipulation,c=p.controls[0],mesh=p.snapshot(),r=rasterMesh(mesh,session.body.pose(),camera);ctx.putImageData(new ImageData(r.pixels,200,200),0,0);
 const rect=canvas.getBoundingClientRect(),candidates=[],part=p.parts.find(part=>part.id===c.part);
 const centre=c.type==='linear'?[rect.left+rect.width/2,rect.top+rect.height/2]:camera.project(scale(add(part.transform.position,rotate(part.transform.orientation,c.pivot.map((v,i)=>v*part.transform.scale[i]))),p.scale),rect,session.body.pose());
 for(const tri of mesh.triangles.filter(t=>t.part===c.part)){
  const point=scale(tri.indices.reduce((sum,i)=>add(sum,mesh.vertices[i]),[0,0,0]),1/3),screen=camera.project(point,rect,session.body.pose());if(!screen)continue;
  const hit=pick(...screen);if(hit?.part!==c.part)continue;
  const score=centre?Math.hypot(screen[0]-centre[0],screen[1]-centre[1]):0;candidates.push({screen,score:c.type==='linear'?-score:score});
 }
 candidates.sort((a,b)=>b.score-a.score);marker.hidden=!candidates.length;if(candidates.length){marker.style.left=`${candidates[0].screen[0]-rect.left}px`;marker.style.top=`${candidates[0].screen[1]-rect.top}px`;}
 output.textContent=`${session.definition.id}\npart=${p.active??'—'}\nmode=${input.pointer?.mode??'idle'}\nvalue=${c.value.toFixed(4)}\nrange=${c.type==='rotate'?'continuous':c.min+' … '+c.max}\ncaptured=${input.pointer?canvas.hasPointerCapture(input.pointer.id):false}\ngeometry unchanged=${JSON.stringify(session.mesh.vertices)===original}\npose=${session.body.pose().map(x=>x.toFixed(3)).join(',')}`;debug?.update();
}
select.addEventListener('change',show);document.querySelector('#reset').addEventListener('click',()=>{input.cancel();session.resetPose();draw();});document.querySelector('#reopen').addEventListener('click',show);
for(const type of ['pointerdown','pointermove','pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,()=>requestAnimationFrame(draw));
const loop=new AnimationLoop(dt=>{input.step(dt);session.step(dt);},()=>{if(performance.now()-lastDraw>100){draw();lastDraw=performance.now();}});
function pause(){input?.cancel();session.body?.cancel();session.manipulation?.cancel();loop.stop();if(input)draw();}function resume(){if(!document.hidden)loop.start();}
document.addEventListener('visibilitychange',()=>document.hidden?pause():resume());window.addEventListener('pagehide',pause);window.addEventListener('pageshow',resume);window.addEventListener('blur',pause);window.addEventListener('focus',resume);new ResizeObserver(()=>{if(input)resize();}).observe(canvas);
show();resume();
</script></html>
