<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#eeeae1">
  <title>ひと粒が、ほどける · 茶葉の試作 02</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="teaCanvas" aria-label="短い茎と二枚の葉を折り込んだ茶葉の塊が、徐々にほどける立体描画。下のスライダーで途中の形を観察できます。"></canvas>
  <header><p class="eyebrow">TEA STUDY / 02</p><h1>ひと粒が、ほどける。</h1><p class="subtitle">折り重なった葉を、ゆっくり見る。</p></header>
  <main id="controls" aria-label="茶葉の観察操作">
    <p id="stage">折り込まれた、ひと粒</p>
    <label class="sr-only" for="progress">ほどけ方の進行</label>
    <input id="progress" type="range" min="0" max="1000" value="0" step="1" aria-valuetext="折り込まれた、ひと粒、0パーセント">
    <div class="endpoints" aria-hidden="true"><span>ひと粒</span><span>ほどける</span></div>
    <div class="actions"><button id="play" type="button">再生</button><button id="reset" type="button">最初に戻す</button></div>
    <div class="speed"><label for="speed">見る速さ</label><select id="speed"><option value="0.5">ゆっくり</option><option value="1" selected>ふつう</option><option value="2">はやく</option></select></div>
    <p class="note">形を観察するための試作です。</p>
  </main>
  <p id="error" role="status" hidden></p>
  <p id="announce" class="sr-only" role="status" aria-live="polite"></p>
  <script src="../../engine/codea-lite.v1.0.0.js"></script>
  <script data-sse-engine src="../../engine/sukimastock-engine.v0.3.0.js"></script>
  <script src="work-config.js"></script><script src="model.js"></script><script src="renderer.js"></script><script src="sketch.js"></script>
  <script>CodeaLite.start('teaCanvas');</script>
</body>
</html>
