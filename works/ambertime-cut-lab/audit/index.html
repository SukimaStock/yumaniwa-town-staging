<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AmberTime · カット味監査</title><style>body{max-width:860px;margin:auto;padding:16px;background:#252837;color:#eee5c8;font:16px/1.6 system-ui}a{color:inherit}label{display:inline-block;margin:6px}select{font:inherit;padding:8px;background:#34384b;color:inherit;border:2px solid #888}img{width:380px;max-width:100%;image-rendering:pixelated}table{border-collapse:collapse;font-size:14px}td,th{padding:5px;border-bottom:1px solid #777;text-align:left}code{overflow-wrap:anywhere}</style><a href="../">← 比較Lab</a><h1>カット味監査</h1><p>本編の既存味モデルを変更せず、合法な3,916区間を仕込み4条件で計算しました。明るさは成分の強さであり、品質・価格の順位ではありません。</p><label>麦芽<select id="malt"><option value="plain">ふつう</option><option value="peat">ピート</option></select></label><label>発酵<select id="ferment"><option value="short">短め</option><option value="long" selected>長め</option></select></label><label>成分<select id="axis"><option value="fruit">果実</option><option value="grain">麦</option><option value="smoke">煙</option><option value="body">厚み</option><option value="rough">刺激</option><option value="spice">スパイス</option></select></label><p>横：採取開始、縦：採取終了（上ほど遅い）。幅12未満は対象外です。</p><img id="heat" alt="開始×終了の成分分布"><div id="stats"></div><h2>価格・店相性の投影</h2><p>既存の価格・販売相性APIを使った比較です。実際の売上や評判の保証ではありません。</p><label>樽<select id="cask"><option value="refill">リフィル</option><option value="first">1stフィル</option></select></label><label>月数<select id="age"><option>0</option><option>12</option><option>60</option><option>120</option></select></label><div id="downstream"></div><p><a href="REPORT.md">監査報告</a> · <a href="summary.json">集計JSON</a> · <a href="profiles.json">全区間データJSON</a></p><script type="module">
const $=id=>document.getElementById(id),d=await(await fetch('./summary.json')).json(),n=v=>Number(v).toFixed(3);function render(){const malt=$('malt').value,ferment=$('ferment').value,axis=$('axis').value,g=d.conditions.find(g=>g.malt===malt&&g.ferment===ferment),a=g.axes[axis];$('heat').src=`./${malt}-${ferment}-${axis}.svg`;$('stats').textContent=`成分範囲 ${n(a.min)}〜${n(a.max)}。数値が同一の味は${g.intervals-g.exactUniqueProfiles}組。0.1刻みの粗い分類では${g.coarsePointOneBins}群。粗い分類の一致を同じ味と断定しません。`;const q=d.ageGroups.find(g=>g.malt===malt&&g.ferment===ferment&&g.cask===$('cask').value&&g.months===Number($('age').value));$('downstream').textContent=`単価 £${q.price.min.toFixed(2)}〜£${q.price.max.toFixed(2)}。価格下限£16：${q.atFloor16}/${q.count}区間。町の酒店の相性 ${n(q.affinity['town-liquor'].min)}〜${n(q.affinity['town-liquor'].max)}、スーパー ${n(q.affinity.supermarket.min)}〜${n(q.affinity.supermarket.max)}。相性は売上本数ではありません。`;}for(const id of ['malt','ferment','axis','cask','age'])$(id).addEventListener('change',render);render();
</script></html>
