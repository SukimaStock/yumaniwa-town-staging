<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f7f8fa">
<title>Town Glance</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header><span class="brand">Town Glance</span><span class="area">この街</span></header>
<section class="map" aria-label="駅、公園、川と現在地の地図">
<svg id="map" viewBox="0 0 360 440" role="img" aria-labelledby="map-title">
<title id="map-title">架空の街。中央にYOU、左下に駅、右上に公園、上側に川があります。</title>
<defs><pattern id="blocks" width="64" height="64" patternUnits="userSpaceOnUse"><rect x="9" y="9" width="46" height="46" rx="5" fill="#e8e9e7" stroke="#e0e2df"/></pattern></defs>
<rect width="360" height="440" fill="#f3f3ef"/><rect x="-20" y="-20" width="400" height="480" fill="url(#blocks)"/>
<path d="M-30 66 Q85 148 188 103 T390 50" fill="none" stroke="#a9d5e4" stroke-width="40"/>
<path d="M-30 66 Q85 148 188 103 T390 50" fill="none" stroke="#c4e5ee" stroke-width="28"/>
<g fill="none" stroke="#fff" stroke-width="12"><path d="M0 181 H360 M0 306 H360 M0 370 H360 M72 0 V440 M180 0 V440 M304 0 V440"/><path d="M0 134 Q90 206 198 151 T360 103" stroke-width="9"/></g>
<path d="M-10 256 H370" stroke="#d6c7a4" stroke-width="24"/><path d="M-10 256 H370" stroke="#fff4d4" stroke-width="20"/>
<path d="M72 440 V314" stroke="#b5b8bd" stroke-width="9"/><path d="M72 440 V314" stroke="#f7f7f7" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="225" y="167" width="66" height="69" rx="10" fill="#c5dfb7" stroke="#b5d0a8"/>
<path d="M236 224 Q258 179 280 181" fill="none" stroke="#eaf2dc" stroke-width="5"/>
<g fill="#aacd98"><circle cx="236" cy="182" r="6"/><circle cx="282" cy="222" r="7"/></g>
<rect x="41" y="312" width="62" height="25" rx="5" fill="#dadde4" stroke="#bcc1cb"/>
<g class="labels"><text x="258" y="207" text-anchor="middle" class="place">中央公園</text><text x="72" y="356" text-anchor="middle" class="place">まちの駅</text><text x="28" y="241">中央通り</text><text x="237" y="133">川沿い通り</text><text x="314" y="208" transform="rotate(90 314 208)">公園通り</text><text x="151" y="84" class="river">みどり川</text></g>
<g id="destination-pins"></g>
<g id="guess-line" hidden><path id="guess-path" d="" fill="none" stroke="#3579d6" stroke-width="4" stroke-linecap="round"/><circle id="guess-end" r="6" fill="#3579d6"/></g>
<g id="you" transform="translate(180 280)"><circle r="21" fill="#4b89df" opacity=".12"/><circle r="9" fill="#367bd8" stroke="white" stroke-width="3"/><text y="34" text-anchor="middle" class="you-label">YOU</text></g>
</svg>
<div id="gesture-area" hidden aria-hidden="true"><div id="origin"></div></div>
<div id="prompt" hidden><h1>だいたい、どっち？</h1><p>YOUから、なんとなく指で。</p></div>
</section>
<section class="card" aria-label="行きたい場所">
<div class="place-info"><span class="category" id="category">カフェ</span><h2 id="name">ひだまりカフェ</h2><p id="address">川沿い通り 12</p></div>
<p id="status" role="status" aria-live="polite"></p>
<button id="action" type="button">場所を見る <span aria-hidden="true">↗</span></button>
<button id="skip" type="button" hidden>予想せず地図を見る</button>
</section>
</main>
<script type="module" src="app.mjs"></script>
</body>
</html>
