<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#f3eee3" />
    <title>あさのつなぎめ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="gameCanvas" aria-label="朝の小さな館内図"></canvas>
    <div id="app">
      <header>
        <div>
          <small>SUKIMASTOCK · A LITTLE ITINERARY</small>
          <h1>あさのつなぎめ</h1>
        </div>
        <button id="sound" aria-label="音を切り替える">音 OFF</button>
      </header>
      <section class="map-space" aria-label="朝の館内図">
        <div id="map-caption"></div>
        <div id="map-places"></div>
      </section>
      <section id="desk" aria-label="つなぎめの手帳">
        <main id="page"></main>
        <footer id="controls"></footer>
      </section>
    </div>
    <dialog id="notebook" aria-labelledby="note-title">
      <div id="note-content"></div>
      <button id="close-note" class="wide">手帳を閉じる</button>
    </dialog>
    <p id="announce" class="sr-only" aria-live="polite"></p>
    <script src="../../engine/codea-lite.v1.0.0.js"></script>
    <script
      data-sse-engine
      src="../../engine/sukimastock-engine.v0.3.0.js"
    ></script>
    <script>
      (() => {
        const bust = /\/yumaniwa-town-staging(?:\/|$)/.test(location.pathname)
          ? "?devbuild=" + Date.now()
          : "";
        const load = (name) =>
          new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = name + bust;
            script.onload = resolve;
            script.onerror = () => reject(new Error("Cannot load " + name));
            document.body.appendChild(script);
          });
        load("work-config.js")
          .then(() => load("model.js"))
          .then(() => load("sketch.js"))
          .then(() => CodeaLite.start("gameCanvas"))
          .catch((error) => {
            document.getElementById("page").textContent =
              "朝の準備に失敗しました。ページを再読み込みしてください。";
            console.error(error);
          });
      })();
    </script>
  </body>
</html>
