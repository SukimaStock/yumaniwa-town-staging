<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#100c0b">
  <title>SukimaStock Engine v0.1.1 Demo</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #100c0b;
      overscroll-behavior: none;
      touch-action: none;
    }

    #gameCanvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 1;
      transition: opacity 120ms linear;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script src="codea-lite.js"></script>
  <script src="sukimastock-engine.js"></script>
  <script src="examples/sketch.starter-demo.js"></script>

  <script>
    CodeaLite.start("gameCanvas");
  </script>
</body>
</html>
