<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PUMPOKO | Feel Lab</title><link rel="stylesheet" href="./style.css?v=terrain-grid-20261010"></head><body>
<header><strong>PUMPOKO · FEEL LAB</strong><small>気持ちいい地形を見つける</small></header>
<nav aria-label="キャラクター"><button data-kind="pumpkin" class="active">ROLL · カボチャ</button><button data-kind="rutabaga">BOUNCE · ルタバガ</button></nav>
<main><canvas id="gameCanvas" aria-label="画面の左右に触れて転がす・跳ねる"></canvas></main>
<div class="steering" aria-label="左右の操作"><button id="left-control" type="button">◀ 左へ</button><button id="right-control" type="button">右へ ▶</button></div>
<section class="panel"><p class="caption">気持ちいい地形を試す（物理設定は現行版）</p>
<div class="terrains"><button data-terrain="bowl" class="active">深い谷</button><button data-terrain="waves">連続谷・難</button><button data-terrain="ramp">助走坂</button><button data-terrain="steps">ぽよん坂</button><button data-terrain="bigU">大きなU字</button><button data-terrain="softWaves">ゆるい連続谷</button><button data-terrain="doubleBounce">二段バウンド</button><button data-terrain="halfpipe">小さなハーフパイプ</button></div>
<div class="actions"><button id="reset">もう一度</button><button id="save">この地形を保存</button></div>
<label for="memo">気持ちよかった瞬間を記録</label><textarea id="memo" rows="2" placeholder="例：谷底で切り返すと勢いが乗った"></textarea><p id="saved" role="status"></p></section>
<footer>左右ボタンを長押し、または画面の左右を押す。ルタバガは着地で押し直す。</footer>
<script src="../pumpoko-02/physics.js"></script><script src="../pumpoko-02/world.js"></script><script src="../pumpoko-02/draw.js"></script><script src="./app.js?v=terrain-grid-20261010"></script>
</body></html>
