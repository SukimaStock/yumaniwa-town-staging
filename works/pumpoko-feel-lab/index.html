<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PUMPOKO | Feel Lab</title><link rel="stylesheet" href="./style.css?v=bd-variants-20261011"></head><body>
<header><strong>PUMPOKO · FEEL LAB</strong><small>気持ちいい地形を見つける</small></header>
<nav aria-label="キャラクター"><button data-kind="pumpkin" class="active">ROLL · カボチャ</button><button data-kind="rutabaga">BOUNCE · ルタバガ</button></nav>
<main><canvas id="gameCanvas" aria-label="画面の左右に触れて転がす・跳ねる"></canvas></main>
<div class="steering" aria-label="左右の操作"><button id="left-control" type="button">◀ 左へ</button><button id="right-control" type="button">右へ ▶</button></div>
<section class="panel">
<div class="study-tabs" role="group" aria-label="地形実験モード"><button data-study="single" class="active" type="button">単体 8種</button><button data-study="chain" type="button">接続 4種</button><button data-study="order" type="button">順番比較 4種</button><button data-study="variant" type="button">B→D 研究</button></div>
<p class="caption">組み合わせと順序を比較する。ROLL / BOUNCE どちらも試せます。</p>
<div id="single-courses" class="terrains" aria-label="単体地形">
<button data-terrain="bowl" class="active">深い谷</button><button data-terrain="waves">連続谷・難</button><button data-terrain="ramp">助走坂</button><button data-terrain="steps">ぽよん坂</button><button data-terrain="bigU">大きなU字</button><button data-terrain="softWaves">ゆるい連続谷</button><button data-terrain="doubleBounce">二段バウンド</button><button data-terrain="halfpipe">小さなハーフパイプ</button></div>
<div id="chain-courses" class="terrains" aria-label="接続コース" hidden>
<button type="button" data-chain="flow">A · FLOW</button><button type="button" data-chain="rhythm">B · RHYTHM</button><button type="button" data-chain="pump">C · PUMP</button><button type="button" data-chain="breath">D · BREATH</button></div>
<div id="order-courses" class="terrains" aria-label="地形の順番比較" hidden>
<button type="button" data-order="ac">A → C</button><button type="button" data-order="ca">C → A</button>
<button type="button" data-order="bd">B → D</button><button type="button" data-order="db">D → B</button></div>
<p id="order-hint" class="caption" hidden>ROLL は A↔C、BOUNCE は B↔D の順番を比較。両キャラクターでどちらも試せます。</p>
<p id="order-progress" class="order-progress" aria-live="off"></p>
<div id="variant-courses" class="terrains" aria-label="B→Dの平面と繰り返し比較" hidden>
<button type="button" data-variant="baseline">B→D · 原型</button>
<button type="button" data-variant="short">平面 · 短</button>
<button type="button" data-variant="long">平面 · 長</button>
<button type="button" data-variant="repeat">B→D→B</button></div>
<p id="variant-hint" class="caption" hidden>原型を基準に、Dの平面の長さと、もう一度Bへ戻る流れを比較。クリアとは別に「また触りたいか」を確かめます。</p>
<p id="variant-progress" class="order-progress" aria-live="off"></p>
<div class="actions"><button id="reset">もう一度</button><button id="save">この感触を保存</button></div>
<details class="observation"><summary>感触を記録する（任意）</summary>
<div class="feel-feedback" role="group" aria-label="今回の感触"><button type="button" data-feedback="retry" class="active">もう一回！</button><button type="button" data-feedback="good">良い瞬間</button><button type="button" data-feedback="lost">勢いが切れた</button></div>
<label for="memo">気持ちよかった瞬間を記録</label><textarea id="memo" rows="2" placeholder="例：平面で勢いが切れた／2つ目の谷が気持ちいい"></textarea></details><p id="saved" role="status"></p>
</section>
<footer>左右を長押し／画面の左右を触る。ルタバガは着地で押し直す。接続コースは左右へ戻ることもできます。</footer>
<script src="../pumpoko-02/physics.js"></script><script src="../pumpoko-02/world.js"></script><script src="../pumpoko-02/draw.js"></script><script src="./app.js?v=bd-variants-20261011"></script>
</body></html>
