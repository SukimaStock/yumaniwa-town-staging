<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>PUMPOKO — 新しい入口</title>
</head>
<body>
  <p>PUMPOKOの入口が変わりました。<a id="new-entry" href="../pumpoko/">新しい入口へ</a></p>
  <script>
    (() => {
      // Keep the current site prefix. Query parameters are never redirect targets.
      const targetPath = location.pathname.replace(/\/works\/pumpoko-02(?:\/index\.html|\/)?$/, "/works/pumpoko/");
      if (targetPath === location.pathname) return;
      const target = targetPath + location.search + location.hash;
      document.getElementById("new-entry").href = target;
      location.replace(target);
    })();
  </script>
</body>
</html>
