<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>PUMPOKO Stage Builder — 新しい入口</title>
</head>
<body>
  <p>PUMPOKO Stage Builderの入口が変わりました。<a id="new-entry" href="../../pumpoko/builder/">新しい入口を開く</a></p>
  <script>
    (() => {
      // Keep the site prefix, but fix the destination; never accept a query redirect target.
      const path = location.pathname.replace(/\/works\/kotsu-koro\/builder(?:\/index\.html|\/)?$/, "/works/pumpoko/builder/");
      const target = path + location.search + location.hash;
      document.getElementById("new-entry").href = target;
      location.replace(target);
    })();
  </script>
</body>
</html>
