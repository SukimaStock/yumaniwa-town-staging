<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#080a10">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title></title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080a10;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    #gameCanvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 1;
      transition: opacity 120ms linear;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
    }

    #ritualHost {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: block;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      background: #090c12;
    }
    #ritualHost.active {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ritualHost" aria-hidden="true"></div>

  <!-- Locale data is loaded before any game module reads display copy. -->
  <script src="orbit-text.js?v=2.9.7"></script>

  <!-- Low-level Codea-compatible canvas runtime -->
  <script src="codea-lite.js?v=2.7.7"></script>

  <!-- Reusable SukimaStock experience layer -->
  <script src="sukimastock-engine.js?v=2.7.7"></script>

  <script>
    (async () => {
      const loadScript = (src) => new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error("Failed to load " + src));
        document.body.appendChild(script);
      });

      await OrbitText.load();
      await loadScript("restore-ritual-inline.js?v=2.7.21");
      await loadScript("sketch.js?v=2.9.7");
      CodeaLite.start("gameCanvas");
    })().catch((error) => {
      console.error("ORBIT bootstrap failed", error);
    });
  </script>
</body>
</html>
