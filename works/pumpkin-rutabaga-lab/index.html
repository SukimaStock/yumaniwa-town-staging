<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f1e7d4">
<title>PUMPKIN × RUTABAGA · Physics Lab</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="gameCanvas" aria-label="カボチャを転がす、ルタバガを跳ねさせる物理実験"></canvas>
<header>
<div class="identity"><span>SukimaStock · PHYSICS LAB</span><h1>PUMPKIN <em>×</em> RUTABAGA</h1></div>
<nav aria-label="実験モード">
<button data-mode="pumpkin" aria-pressed="true">PUMPKIN</button>
<button data-mode="rutabaga" aria-pressed="false">RUTABAGA</button>
<button data-mode="handoff" aria-pressed="false">HANDOFF</button>
<div class="world-group">
<button data-mode="world" aria-pressed="false">WORLD LOOP</button>
<select id="world-course" aria-label="WORLD LOOP コース"><option value="world">基準（現行）</option><option value="world2">2回</option><option value="world4">4回</option></select>
</div>
</nav>
</header>
<div id="feel" aria-live="polite">するする、ころころ</div>
<footer>
<p id="hint">画面の左・右を押す。切り返して、勢いをつくる。</p>
<div class="controls"><button id="reset">RESET</button><button id="sound" aria-pressed="true">SOUND ON</button><button id="tune" aria-expanded="false" aria-controls="tuning">調整</button></div>
<small>PC: ← → / A D · R でリセット</small>
</footer>
<aside id="tuning" hidden aria-label="物理定数の調整">
<div class="panel-head"><strong>触り心地の調整</strong><button id="close-tune" aria-label="調整を閉じる">×</button></div>
<p>値はすぐ反映。RESETは位置だけ戻します。</p>
<div id="sliders"></div>
<details id="comparison-stats"><summary>比較の計測</summary><pre id="measurements">WORLD LOOP系列を選ぶと計測を開始します。</pre></details>
<button id="defaults">初期の触り心地へ戻す</button>
</aside>
<output id="boot-error" hidden>起動できませんでした。ページを再読み込みしてください。</output>
<script src="../../engine/codea-lite.v1.0.0.js"></script>
<script data-sse-engine src="../../engine/sukimastock-engine.v0.3.0.js"></script>
<script src="./physics.js"></script>
<script src="./world.js"></script>
<script src="./courses.js"></script>
<script src="./measurements.js"></script>
<script src="./draw.js"></script>
<script src="./world-draw.js"></script>
<script src="./app.js"></script>
<script>
try { CodeaLite.start('gameCanvas'); } catch (error) { document.getElementById('boot-error').hidden = false; console.error(error); }
</script>
</body>
</html>
