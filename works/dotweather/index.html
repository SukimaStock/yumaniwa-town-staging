<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#070a17">
  <meta name="description" content="世界の空を、静かなドットで眺める天気アプリ。">
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://sukimastock.github.io/yumaniwa-town/?work=dotweather">
  <title>DotWeather</title>

  <!-- Privacy-friendly analytics by Plausible.
       staging では本番解析へテストアクセスを混ぜない。 -->
  <script>
    (function () {
      var isStaging = /\/yumaniwa-town-staging(?:\/|$)/.test(window.location.pathname);
      if (isStaging) return;

      var script = document.createElement("script");
      script.async = true;
      script.src = "https://plausible.io/js/pa-sYe-y0PqpZapFe6FJVlK2.js";
      document.head.appendChild(script);

      window.plausible = window.plausible || function () {
        (window.plausible.q = window.plausible.q || []).push(arguments);
      };
      window.plausible.init = window.plausible.init || function (options) {
        window.plausible.o = options || {};
      };
      window.plausible.init();
    })();
  </script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070a17;
      overscroll-behavior: none;
      touch-action: none;
    }

    #gameCanvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      -webkit-tap-highlight-color: transparent;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script src="codea-lite.js"></script>
  <script src="sukimastock-engine.js"></script>
  <script src="dotweather-data.js"></script>
  <script src="dotweather-pixel.js"></script>
  <script src="dotweather-world.js"></script>
  <script src="dotweather-wind.js"></script>
  <script src="dotweather-ui.js"></script>
  <script src="dotweather-debug.js"></script>
  <script src="dotweather-rain.js"></script>
  <script src="dotweather-showers.js"></script>
  <script src="dotweather-moon.js"></script>
  <script src="dotweather-rainbow.js"></script>
  <script src="dotweather-clearclouds.js"></script>
  <script src="dotweather-viewmode.js"></script>
  <script src="sketch.js"></script>

  <script>
    CodeaLite.start("gameCanvas");
  </script>
</body>
</html>
