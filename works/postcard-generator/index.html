<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="図形と色の文法で、水辺の街を生成する。seedで再現し、SVG・PNGで保存できるPostcard Generator Lab 0.1。"><title>Postcard Generator Lab 0.1 · SukimaStock</title><link rel="stylesheet" href="style.css"></head>
<body><header><a href="../../lab/">← LAB</a><h1>Postcard Generator <span>Lab 0.1</span></h1></header>
<main><section class="studio" aria-label="ポストカード生成"><div class="picture"><div id="art" aria-live="off"></div></div><div class="controls"><button id="generate" class="primary">新しい街を生成</button><form id="seed-form"><label for="seed">Seed</label><div class="seed-row"><input id="seed" name="seed" maxlength="100" autocomplete="off" spellcheck="false" required><button type="submit">再表示</button></div></form><div class="settings"><label>配色<select id="palette"><option value="auto">おまかせ</option></select></label><label>街の輪郭<select id="composition"><option value="auto">おまかせ</option><option value="hill">丘</option><option value="valley">谷</option><option value="slope">斜面</option><option value="twin">ふたつの丘</option></select></label><label>密度<select id="density"><option value="normal">標準</option><option value="open">ゆったり</option><option value="dense">密集</option></select></label></div><div class="exports"><button id="svg">SVG保存</button><button id="png">PNG保存</button><button id="share">URLをコピー</button><button id="settings-save">設定を保存</button></div><p id="status" role="status" aria-live="polite"></p><details><summary>生成の記録</summary><p id="record"></p><a href="DESIGN.md">生成ルール</a> · <a href="VISUAL-REVIEW.md">視覚検証</a></details></div></section>
<section class="comparison" aria-label="ポストカードの比較"><div class="comparison-heading"><h2>並べて見る</h2><button id="compare">36枚を生成</button></div><p class="hint">絵を選ぶと大きく表示します。</p><div id="gallery"></div></section></main><script type="module" src="app.mjs"></script></body></html>
