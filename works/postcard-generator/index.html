<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="図形と配色の文法から、水辺・建物アップ・道路沿い・広場・坂道のポストカードを生成。seedで再現し、SVG・PNGで保存できます。"><title>Postcard Generator Lab 0.2 · SukimaStock</title><link rel="stylesheet" href="style.css?v=0.2.2"></head>
<body><header><a href="../../lab/">← LAB</a><h1>Postcard Generator <span>Lab 0.2</span></h1></header>
<main><section class="studio" aria-label="ポストカード生成"><div class="picture"><div id="art" aria-live="off"></div></div><div class="controls"><button id="generate" class="primary">新しい街を生成</button><form id="seed-form"><label for="seed">Seed</label><div class="seed-row"><input id="seed" name="seed" maxlength="100" autocomplete="off" spellcheck="false" required><button type="submit">再表示</button></div></form><div class="settings primary-settings"><label for="scene">風景<select id="scene"><option value="auto">おまかせ</option></select></label><label for="palette">配色<select id="palette"><option value="auto">おまかせ</option></select></label></div>
<details class="fine-settings"><summary>形と色の設定</summary><div class="settings"><label for="density">建物の密度<select id="density"><option value="normal">標準</option><option value="open">少なめ</option><option value="dense">多め</option></select></label><label for="composition">街の輪郭<select id="composition"><option value="auto">おまかせ</option><option value="hill">丘</option><option value="valley">谷</option><option value="slope">斜面</option><option value="twin">ふたつの丘</option></select></label><label for="roofs">屋根<select id="roofs"><option value="auto">おまかせ</option><option value="gable">切妻</option><option value="hip">台形</option><option value="flat">平屋根</option><option value="shed">片流れ</option><option value="round">丸屋根</option></select></label><label for="windows">窓<select id="windows"><option value="auto">おまかせ</option><option value="rect">四角</option><option value="arch">アーチ</option><option value="paired">二連</option></select></label><label for="colorMode">色の関係<select id="colorMode"><option value="auto">おまかせ</option><option value="varied">多色</option><option value="tonal">同系色</option><option value="accent">一軒を主役に</option></select></label><label for="facade">外壁のパターン<select id="facade"><option value="auto">おまかせ</option><option value="plain">シンプル</option><option value="grid">格子窓</option><option value="terrace">横一列のテラス</option></select></label><label for="sky">空<select id="sky"><option value="auto">おまかせ</option><option value="clear">雲なし</option><option value="clouds">雲あり</option></select></label><label for="version">生成バージョン<select id="version"><option value="0.2">0.2</option><option value="0.1">0.1を再現</option></select></label></div></details>
<div class="exports"><button id="svg">SVG保存</button><button id="png">PNG保存</button><button id="share">URLをコピー</button><button id="settings-save">設定を保存</button></div><p id="status" role="status" aria-live="polite"></p><details><summary>生成の記録</summary><p id="record"></p><a href="DESIGN-0.2.md">生成ルール</a> · <a href="REVIEW-0.2.md">視覚検証</a> · <a href="review-v02/">40枚の比較</a></details></div></section>
<section class="comparison" aria-label="ポストカードの比較"><div class="comparison-heading"><h2>並べて見る</h2><button id="compare">36枚を生成</button></div><p class="hint">絵を選ぶと大きく表示します。<span id="gallery-config"></span></p><div id="gallery"></div></section></main><script type="module" src="app.mjs?v=0.2.2"></script></body></html>
