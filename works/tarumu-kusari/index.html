<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="端の輪を引き、鎖のたるみから重りへ力が伝わる感触を試す作品。">
<title>たるむ鎖</title>
<link rel="stylesheet" href="style.css">
<script src="main.js" defer></script>
</head>
<body>
<nav><a href="../../lab/#bench" aria-label="LABへ戻る">← LAB</a><button id="reset" type="button" aria-label="鎖と重りを最初の位置に戻す">↺</button></nav>
<main>
<svg id="scene" viewBox="0 0 360 600" aria-label="七つの輪でつながった重りと引き輪">
<defs>
 <linearGradient id="metal" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#656861"/><stop offset=".35" stop-color="#d1cebd"/><stop offset=".58" stop-color="#aaa998"/><stop offset="1" stop-color="#62665e"/></linearGradient>
 <linearGradient id="brass" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#d7b983"/><stop offset=".5" stop-color="#a78851"/><stop offset="1" stop-color="#6e5734"/></linearGradient>
</defs>
<g id="weight" aria-hidden="true">
 <ellipse cx="183" cy="192" rx="34" ry="12" fill="#171c19" opacity=".35"/>
 <path d="M155 155 Q155 147 164 147 H196 Q205 147 205 155 L210 184 Q210 196 180 196 Q150 196 150 184Z" fill="url(#metal)" stroke="#4d514a" stroke-width="2"/>
 <ellipse cx="180" cy="153" rx="23" ry="7" fill="#8e9387"/>
 <path d="M172 190 V201 Q180 209 188 201 V190" fill="none" stroke="#424a42" stroke-width="5"/>
</g>
<g id="links" aria-hidden="true"></g>
<g id="handle" role="slider" tabindex="0" aria-label="端の輪。下へ引き、上へ戻す。矢印キーでも操作できます" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="160" aria-valuenow="0">
 <circle class="hit" r="36" fill="transparent"/>
 <circle class="focus" r="33" fill="none" stroke="#e4d4a5" stroke-width="2"/>
 <ellipse cx="3" cy="5" rx="23" ry="26" fill="none" stroke="#171c19" stroke-width="7" opacity=".35"/>
 <ellipse rx="23" ry="26" fill="none" stroke="#54472f" stroke-width="8"/>
 <ellipse rx="23" ry="26" fill="none" stroke="url(#brass)" stroke-width="5"/>
</g>
</svg>
</main>
</body>
</html>
