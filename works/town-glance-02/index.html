<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f3f0e6"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>Town Glance · Skopje</title><link rel="stylesheet" href="style.css"></head><body>
<main class="town">
<header><h1>SKOPJE</h1><span>Town Glance</span></header>
<section class="city" aria-label="小さなスコピエ">
<img src="scene.svg" alt="ヴォドノの十字架、マケドニア広場、ヴァルダル川を渡る石橋、その向こうのオールドバザールがひとつながりに見える小さな街。YOUは広場のそば。" draggable="false">
<svg id="shops" viewBox="0 0 430 590" role="img" aria-label="街の中の3つの仮の店"></svg>
</section>
<section class="where" aria-label="行き先を選ぶ">
<div class="where-heading"><h2>どこ行く？</h2><span id="selection" role="status" aria-live="polite"></span></div>
<div class="choices">
<button data-place="cafe" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h11v7a5 5 0 0 1-11 0Zm11 1h2a3 3 0 0 1 0 6h-2M6 21h11M8 3v2m4-2v2"/></svg><span>カフェ</span></button>
<button data-place="bread" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14c0-5 4-8 9-8s9 3 9 8v4H3ZM8 8l2 4m3-5 2 4m3-2 1 3"/></svg><span>パン屋</span></button>
<button data-place="books" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5c4-1 6 0 9 2 3-2 5-3 9-2v14c-4-1-6 0-9 2-3-2-5-3-9-2ZM12 7v14"/></svg><span>本屋</span></button>
</div>
<p class="disclosure">街はスコピエをモチーフに。店とYOUは仮配置です。</p>
</section>
<noscript>行き先を選ぶにはJavaScriptを有効にしてください。</noscript>
</main><script type="module" src="app.mjs"></script></body></html>
