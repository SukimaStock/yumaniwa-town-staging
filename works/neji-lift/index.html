<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="丸いつまみを回し、ねじで台を少しずつ上下させる作品。離すとその高さで止まります。">
<title>ねじで持ち上げる</title>
<link rel="stylesheet" href="style.css">
<script src="main.js" defer></script>
</head>
<body>
<main>
<svg id="scene" viewBox="0 0 360 600" aria-label="ねじで上下する台と丸いつまみ">
<defs>
 <linearGradient id="steel"><stop stop-color="#535c56"/><stop offset=".38" stop-color="#c3c7b5"/><stop offset=".6" stop-color="#919e91"/><stop offset="1" stop-color="#424e48"/></linearGradient>
 <linearGradient id="brass" x2=".8" y2="1"><stop stop-color="#d6bb82"/><stop offset=".55" stop-color="#ab884f"/><stop offset="1" stop-color="#715532"/></linearGradient>
 <clipPath id="shaft-clip"><rect x="170" y="158" width="20" height="244" rx="3"/></clipPath>
</defs>
<g aria-hidden="true">
 <ellipse cx="180" cy="491" rx="112" ry="16" fill="#14251f" opacity=".18"/>
 <path d="M89 473 L108 452 H252 L271 473 V486 H89Z" fill="#56665a"/>
 <path d="M89 473 H271 V486 H89Z" fill="#384d43"/>
 <rect x="121" y="146" width="10" height="314" rx="5" fill="url(#steel)"/>
 <rect x="229" y="146" width="10" height="314" rx="5" fill="url(#steel)"/>
 <rect x="170" y="158" width="20" height="244" rx="3" fill="url(#steel)"/>
 <g id="threads" clip-path="url(#shaft-clip)" stroke="#34473d" stroke-width="2.5"></g>
 <rect x="113" y="144" width="134" height="15" rx="5" fill="#69796a"/>
 <g id="platform">
  <rect x="115" y="326" width="22" height="31" rx="4" fill="#748677"/>
  <rect x="223" y="326" width="22" height="31" rx="4" fill="#748677"/>
  <rect x="163" y="322" width="34" height="34" rx="5" fill="url(#brass)"/>
  <path d="M83 322 L103 309 H257 L277 322 V336 H83Z" fill="#bb9c68"/>
  <path d="M83 322 H277 V336 H83Z" fill="#876d46"/>
  <path d="M86 322 H274" stroke="#d8bd8b" stroke-width="2"/>
 </g>
 <rect x="164" y="390" width="32" height="58" rx="8" fill="#526b5a"/>
 <circle cx="180" cy="432" r="52" fill="#1e3529" opacity=".3"/>
</g>
<g id="knob" tabindex="0" role="slider" aria-label="丸いつまみ。時計回りで上がり、逆回りで下がります。矢印キーでも操作できます" aria-valuemin="0" aria-valuemax="144" aria-valuenow="48" aria-orientation="vertical" aria-describedby="hint">
 <circle cx="180" cy="426" r="59" class="focus"/>
 <circle cx="180" cy="426" r="54" fill="transparent"/>
 <circle cx="180" cy="426" r="48" fill="#6e5532" stroke="#3f402e" stroke-width="2"/>
 <circle cx="180" cy="423" r="45" fill="url(#brass)" stroke="#d9bf88" stroke-width="1.5"/>
 <g id="dial" stroke="#6b512f" stroke-width="2" stroke-linecap="round">
  <path d="M180 385V393 M218 423H210 M180 461V453 M142 423H150"/>
  <circle cx="180" cy="396" r="4" fill="#eee0b6" stroke="none"/>
  <circle cx="180" cy="423" r="10" fill="#9a7e4c" stroke="#765e39"/>
 </g>
</g>
</svg>
<p id="hint">つまみを回すと、台が上下します</p>
</main>
</body>
</html>
