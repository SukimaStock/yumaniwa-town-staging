  const a=field[(iy&15)*16+(ix&15)],b=field[(iy&15)*16+((ix+1)&15)],
   c=field[((iy+1)&15)*16+(ix&15)],d=field[((iy+1)&15)*16+((ix+1)&15)];
  return (a+(b-a)*u)*(1-v)+(c+(d-c)*u)*v;
 }
 function texture(index){
  index=(index+FRAMES)%FRAMES;if(textures.has(index))return textures.get(index);
  const c=make(W,H),ctx=c.getContext('2d'),im=ctx.createImageData(W,H),data=im.data;
  const phase=index/FRAMES,flow=phase*16;
  for(let y=0;y<H;y++){
   const z=1-(y+.5)/H,fade=smooth(z/.11)*smooth((1-z)/.31);
   const spread=.085+.42*z+.09*Math.sin(z*Math.PI);
   for(let x=0;x<W;x++){
    const xx=(x+.5)/W*2-1;
    const drift=(noise(z*3+1.4,-flow+2.7)-.5)*z*.64+Math.sin(z*5.8)*z*.075;
    const edge=Math.exp(-Math.pow((xx-drift)/spread,2)*2.65);
    if(edge*fade<.002)continue;
    const wx=xx*3.1+(noise(xx*2+9.2,z*4-flow)-.5)*1.55;
    const wy=z*7.4-flow;
    const broad=noise(wx+3.7,wy),fold=noise(wx*2.1+8.1,wy*2),fine=noise(wx*4.3+2,wy*4);
    const density=clamp((broad*.58+fold*.29+fine*.13-.24)*1.7);
    // Thin dense folds and translucent holes belong to one rising volume.
    const strands=.72+.28*noise(wx*3.1+11,wy*2);
    const a=edge*fade*Math.pow(density,1.24)*strands*.72;
    const i=(y*W+x)*4,light=clamp(.45+fold*.55);
    data[i]=239+16*light;data[i+1]=238+14*light;data[i+2]=230+15*light;
    data[i+3]=Math.round(a*255);
   }
  }
  ctx.putImageData(im,0,0);textures.set(index,c);return c;
 }
 function plume(ctx,x,y,width,height,timeMs,opacity=1,offset=0,lean=0,mirror=false){
  if(opacity<=0||width<=0||height<=0)return;
  const f=(((timeMs/10800+offset)%1+1)%1)*FRAMES,i=Math.floor(f),u=f-i;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);if(mirror)ctx.scale(-1,1);
  const alpha=ctx.globalAlpha*opacity;
  ctx.globalAlpha=alpha*(1-u);ctx.drawImage(texture(i),-width/2,-height,width,height);
  ctx.globalAlpha=alpha*u;ctx.drawImage(texture(i+1),-width/2,-height,width,height);
  ctx.restore();
 }
 function small(ctx,x,y,scale=1,timeMs=0,opacity=1){
  plume(ctx,x-8*scale,y+3*scale,46*scale,65*scale,timeMs,opacity*.58,.23,-.09);
  plume(ctx,x+9*scale,y+4*scale,42*scale,54*scale,timeMs,opacity*.45,.71,.11,true);
 }
 window.OdenVapor={plume,small};
