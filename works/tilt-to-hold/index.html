<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>傾けて止める</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><a href="../../lab/">LABへ</a><h1>傾けて止める</h1><span>おやすみ工房</span></header>
<main>
<p class="hint" id="hint">つまみを上下に。水平ですべり、少し傾けると止まる。</p>
<div class="apparatus">
<svg viewBox="0 0 360 560" aria-hidden="true">
<defs><linearGradient id="metal"><stop stop-color="#687570"/><stop offset=".5" stop-color="#d8dfd3"/><stop offset="1" stop-color="#7d8880"/></linearGradient></defs>
<ellipse cx="164" cy="526" rx="49" ry="7" fill="#172620" opacity=".09"/>
<path d="M164 34 V510" stroke="#c5c9bd" stroke-width="10" stroke-linecap="round"/>
<path d="M162 34 V510" stroke="#e7e9de" stroke-width="2" stroke-linecap="round"/>
<path d="M145 511 H183" stroke="#8f9a8e" stroke-width="5" stroke-linecap="round"/>
<g id="ring"><g id="tilt">
<ellipse rx="37" ry="13" fill="none" stroke="#56685d" stroke-width="9"/>
<path d="M-36 0 A36 13 0 0 0 36 0" fill="none" stroke="url(#metal)" stroke-width="7"/>
<path d="M36 0 H67" stroke="#9ca98e" stroke-width="7" stroke-linecap="round"/>
<circle cx="72" r="12" fill="#bdc6a7" stroke="#64765f" stroke-width="2"/>
<path d="M69 -4 V4 M75 -4 V4" stroke="#79896e" stroke-width="1.5"/>
</g></g>
</svg>
<button id="handle" aria-label="輪の傾き" aria-describedby="hint" role="slider" aria-valuemin="-18" aria-valuemax="18" aria-valuenow="10" aria-valuetext="傾いて停止。上下矢印で傾き変更、左右矢印で水平" tabindex="0"></button>
</div>
<div class="under"><output id="state" aria-live="polite">とまる</output><button id="reset">上から、もう一度</button></div>
<details><summary>小さな記録</summary><p>狙いは、落ちる途中をほんの少し傾けて止めること。つまみを上下になぞると角度が変わり、水平に近づけると滑ります。離しても傾きは残ります。</p><p>摩擦は角度の境目で近似しています。7度でつかまり、4度以内で再び滑ります。実物の接触や重さの再現ではなく、速度にも上限があります。引いて離すばね運動はありません。</p><p>実機iPhone・iPadの手触りと、作者の採用判断は未確認です。</p></details>
</main>
<script src="app.js"></script>
</body></html>
