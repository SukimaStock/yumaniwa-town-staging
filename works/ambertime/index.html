<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>AmberTime — 時間を育てる蒸留所</title>
  <meta name="theme-color" content="#ede5d6">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div><p class="edition">小さな蒸留所の帳面 · WEB 0.1</p><h1>AmberTime<span>時間を育てる蒸留所</span></h1></div>
      <a class="back-link" href="../../lab/">研究所へ</a>
    </header>
    <div id="storage-notice" class="notice storage-notice" role="status" hidden></div>
    <div id="recovery" hidden></div>
    <div id="game" hidden>
      <section class="monthbar" aria-label="蒸留所の現在">
        <div><span class="label">帳面の日付</span><strong id="month"></strong></div>
        <div><span class="label">手元の資金</span><strong id="cash"></strong></div>
        <button id="advance" class="primary" type="button">1か月進める <span aria-hidden="true">→</span></button>
        <p id="upkeep" class="month-cost"></p>
      </section>
      <div id="message" class="notice action-notice" role="status" aria-live="polite" hidden></div>
      <nav class="rooms" aria-label="蒸留所の部屋">
        <button type="button" data-room="warehouse" aria-current="page">貯蔵庫</button>
        <button type="button" data-room="distillery">蒸留室</button>
        <button type="button" data-room="sales">販売室</button>
      </nav>
      <main id="room" tabindex="-1"></main>
      <details class="ledger"><summary>蒸留所の帳面</summary><div id="journal"></div></details>
      <footer class="footer">
        <div class="save-row"><button id="save" type="button">保存する</button><span id="save-status"></span></div>
        <details class="restart"><summary>新しい蒸留所を始める</summary>
          <p>今の進行を初期化します。同じシードと操作なら、同じ結果を再現できます。</p>
          <form id="restart-form"><label for="seed">シード</label><input id="seed" name="seed" type="number" min="1" max="4294967295" step="1" required value="20261014"><button type="submit">初期化して始める</button></form>
        </details>
        <p class="smallprint">月の流れを縮めた、小さな経営ゲームです。£はゲーム内の通貨で、実際のウイスキーの熟成期間・価格を再現するものではありません。操作ごとに、このブラウザへ自動保存します。</p>
      </footer>
    </div>
    <noscript><p class="notice">AmberTimeを遊ぶにはJavaScriptを有効にしてください。</p></noscript>
  </div>
</body>
</html>
