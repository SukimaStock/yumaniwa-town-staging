<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#172124">
<title>AmberTime — 時間を育てる蒸留所</title>
<link rel="stylesheet" href="./journey.css"><script type="module" src="./journey-app.mjs"></script>
</head>
<body>
<div class="page">
<header><div><h1>AmberTime</h1><span class="edition">0.3 · Time & Choice</span></div><a href="../../lab/">研究所へ</a></header>
<p id="storage-notice" role="status" hidden></p>
<main id="game" hidden>
<section class="warehouse" aria-label="一樽の熟成">
<div class="stamp"><span id="cask-kind"></span><strong id="age"></strong></div>
<div class="objects"><div id="barrel" class="barrel"></div><div id="glass" class="glass"></div></div>
<div class="amount"><span id="amount"></span><span id="loss"></span></div>
<div class="taste" id="taste"></div>
<p id="change" class="change"></p>
</section>
<section id="decision" class="decision" aria-live="polite" hidden></section>
<section id="result" class="result" hidden></section>
<div id="time-controls" class="time-controls"><button id="toggle-time" type="button">ひと休み</button><button id="skip" type="button">次の変化まで</button></div>
<p id="time-status" class="time-status" role="status"></p>
<details id="ledger" class="ledger"><summary>この樽の帳面</summary><div id="ledger-body"></div></details>
<details id="records" class="records" hidden><summary>これまでの一本</summary><div id="records-body"></div></details>
</main>
<section id="recovery" hidden><p>保存された記録を残したまま、進行を止めています。</p></section>
<footer><a href="./legacy.html">以前の蒸留所</a><details><summary>保存・遊び方</summary><p>樽の変化を見守り、節目で残すか瓶詰めするかを選びます。画面を離れると時間は止まります。戻ったら「続きを見守る」で再開できます。</p><p>操作と月の経過ごとに保存します。以前の蒸留所の保存とは別の記録です。</p><button id="reset" type="button">この記録を初期化</button><span id="save-status" role="status"></span></details></footer>
<noscript><p>JavaScriptを有効にしてください。</p></noscript>
</div>
</body></html>
