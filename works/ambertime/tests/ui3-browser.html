<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AmberTime UI第三弾の表示検証</title>
<style>body{margin:0;background:#171923;color:#eee;font:14px system-ui}header{padding:8px;display:flex;gap:5px;flex-wrap:wrap}button{min-height:40px}#stage{display:flex;justify-content:center;padding:8px;overflow:auto}iframe{border:1px solid #858995;width:390px;height:680px;flex:none}output{display:block;padding:8px;white-space:pre-wrap;font:12px monospace}</style>
<header><span>表示検証専用。実保存は読み書きしません。</span><button data-size="360,568">360×568</button><button data-size="375,620">375×620</button><button data-size="390,680">390×680</button><button data-size="430,740">430×740</button><button data-command="map">地図を開く</button><button data-command="sales">販売室へ</button><button data-command="policy">担当者設定</button><button data-command="legacy1">旧設定1本</button><button data-command="legacy7">旧設定7本</button><button data-command="fail">次の保存を失敗</button><button data-command="measure">測定</button></header>
<main id="stage"><iframe id="frame" title="AmberTime UI検証"></iframe></main><output id="status">準備中</output>
<script>
const frame=document.getElementById('frame'),base=new URL('../',location.href),fixture=new URL('./ui3-browser-fixture.mjs',location.href);
frame.srcdoc=`<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="${base}">${['shop.css','room-scene.css','font-uniform.css','market.css','m0-observation.css'].map(file=>`<link rel="stylesheet" href="${file}?qa=ui3">`).join('')}</head><body data-room="sales"><div id="scene-root"></div><div id="market-board"></div><button id="open-world-map" hidden>地図</button><dialog id="action-dialog" data-kind="bottler-panel"><div class="dialog-heading"><h2>ビン詰め担当者</h2><button id="close-policy" type="button">閉じる</button></div><div id="dialog-body"></div><div id="dialog-actions"></div></dialog><script type="module" src="${fixture}"><\/script></body></html>`;
for(const button of document.querySelectorAll('[data-size]'))button.addEventListener('click',()=>{const [w,h]=button.dataset.size.split(',');frame.style.width=w+'px';frame.style.height=h+'px';});
for(const button of document.querySelectorAll('[data-command]'))button.addEventListener('click',()=>frame.contentWindow.postMessage({ui3Command:button.dataset.command},location.origin));
window.addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.data?.ui3Report)document.getElementById('status').textContent=JSON.stringify(event.data.ui3Report,null,2);});
</script></html>
