<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AmberTime 起動診断の隔離検証</title>
<style>body{margin:0;background:#171923;color:#eee;font:14px system-ui}header{padding:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}button,select{min-height:44px}main{display:flex;justify-content:center;padding:8px;overflow:auto}iframe{border:1px solid #858995;width:390px;height:680px;flex:none}output{display:block;padding:8px;white-space:pre-wrap;font:12px monospace}</style>
<header><span>検証専用。本編の起動処理を実行し、保存はメモリ内だけです。</span><button data-size="360,568">360×568</button><button data-size="375,620">375×620</button><button data-size="390,680">390×680</button><button data-size="430,740">430×740</button>
<label>記録 <select id="scenario"><option value="normal">初期の正式記録</option><option value="progressed">8か月進行・40操作</option><option value="backups">進行記録＋既存バックアップ3件</option><option value="empty">記録なし</option></select></label>
<label>故障 <select id="fault"><option value="none">なし</option><option value="candidate-create">候補作成</option><option value="candidate-validation">候補検証</option><option value="continue-restore">継続復元</option><option value="backup-write">バックアップ書込み</option><option value="backup-readback">バックアップ読戻し</option><option value="formal-write">正式書込み</option><option value="formal-readback">正式読戻し</option><option value="session-apply">本編適用</option></select></label><button id="reset">検証を開始</button><button id="measure">状態を確認</button></header>
<main><iframe id="frame" title="AmberTime 隔離起動検証"></iframe></main><output id="status">準備中</output><script type="module" src="./entry-diagnostic-browser.mjs"></script></html>
