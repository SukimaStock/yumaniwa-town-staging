<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AmberTime 本編起動の表示検証</title>
<style>body{margin:0;background:#171923;color:#eee;font:14px system-ui}header{padding:8px;display:flex;gap:5px;flex-wrap:wrap}button{min-height:44px}main{display:flex;justify-content:center;padding:8px;overflow:auto}iframe{border:1px solid #858995;width:390px;height:680px;flex:none}</style>
<header><span>通常URLの本編です。保存領域も本編と共通です。</span><button data-size="360,568">360×568</button><button data-size="375,620">375×620</button><button data-size="390,680">390×680</button><button data-size="430,740">430×740</button><button id="reload">本編を再読み込み</button></header>
<main><iframe id="frame" title="AmberTime 本編" src="../"></iframe></main>
<script>const frame=document.getElementById('frame');for(const b of document.querySelectorAll('[data-size]'))b.addEventListener('click',()=>{const [w,h]=b.dataset.size.split(',');frame.style.width=w+'px';frame.style.height=h+'px';});document.getElementById('reload').addEventListener('click',()=>{frame.src=frame.src;});</script></html>
