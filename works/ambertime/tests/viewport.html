<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AmberTime 表示検証</title>
<style>*{box-sizing:border-box}body{margin:0;background:#070a0b;color:#d9d1bc;font:14px system-ui}header{padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{min-height:44px;background:#292c29;border:1px solid #79715e;color:inherit;padding:8px 12px}#stage{display:flex;justify-content:center;min-width:max-content;padding:0 8px 24px}iframe{display:block;width:390px;height:844px;border:0;flex:none}small{opacity:.7}</style>
<header><button data-size="390,844">iPhone 390 × 844</button><button data-size="320,568">小画面 320 × 568</button><button data-size="844,390">横向き 844 × 390</button><button data-size="1280,900">PC 1280 × 900</button><button id="fresh">新しい試遊</button><small>表示検証・保存データは変更しません</small></header><main id="stage"><iframe id="game-frame" title="AmberTime 試遊" src="../index.html?preview=1"></iframe></main>
<script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{const [w,h]=button.dataset.size.split(',');frame.style.width=w+'px';frame.style.height=h+'px';}));document.querySelector('#fresh').addEventListener('click',()=>{frame.src='../index.html?preview=1&trial='+Date.now();});</script></html>
