<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>AmberTime 蒸留所の歩みLab</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./lab.mjs"></script>
</head>
<body>
<main>
  <section id="menu" aria-labelledby="title">
    <a href="../../../lab/#room-bench">‹ LAB</a>
    <h1 id="title">蒸留所の歩み</h1>
    <label>プレイ記録 <select id="record" disabled></select></label>
    <label>回想する時点
      <select id="horizon">
        <option value="handover">世代交代</option>
        <option value="anniversary">30年経過</option>
      </select>
    </label>
    <label>見せ方
      <select id="mode">
        <option value="a">A　一定のテンポ</option>
        <option value="b">B　日々の仕事をまとめる</option>
        <option value="c">C　後年の再登場を見せる</option>
        <option value="d" selected>D　出来事を選んで振り返る</option>
      </select>
    </label>
    <button id="open" disabled>回想を開く</button>
    <button id="compare" disabled aria-haspopup="dialog">編集を比較</button>
    <p id="status" role="status">記録を読み込んでいます。</p>
    <p>地図は現在のゲーム素材で再構成しています。</p>
    <a href="./REPORT.md">試作と検証の記録</a>
  </section>
  <section id="recall" aria-label="蒸留所の歩み" hidden>
    <header><span id="period"></span><button id="close">閉じる</button></header>
    <button id="picture" aria-label="次の場面">
      <canvas aria-hidden="true"></canvas>
      <span id="object" aria-hidden="true"></span>
    </button>
    <div class="caption" aria-live="polite" aria-atomic="true">
      <p id="date"></p><h2 id="place"></h2><p id="fact"></p>
    </div>
    <nav aria-label="場面">
      <button id="previous">前へ</button>
      <span id="count"></span>
      <button id="next">次へ</button>
    </nav>
    <div class="tools">
      <select id="jump" aria-label="時期へ移動"></select>
      <button id="sources" aria-haspopup="dialog">根拠</button>
    </div>
  </section>
  <dialog id="evidence" aria-labelledby="evidence-title">
    <h2 id="evidence-title">場面の根拠</h2>
    <pre id="details"></pre>
    <form method="dialog"><button>閉じる</button></form>
  </dialog>
  <dialog id="comparison" aria-labelledby="comparison-title">
    <form method="dialog"><button>閉じる</button></form>
    <h2 id="comparison-title">編集の比較</h2>
    <table>
      <thead><tr><th scope="col">方式</th><th scope="col">独立</th><th scope="col">経過</th><th scope="col">合計</th></tr></thead>
      <tbody id="comparison-counts"></tbody>
    </table>
    <details><summary>Dで選んだ出来事</summary><ol id="selected-events"></ol></details>
    <details><summary>Dで省いた出来事</summary><ul id="omitted-events"></ul></details>
    <details><summary>評価・抽選・時間分布</summary><pre id="edition-audit"></pre></details>
  </dialog>
</main>
</body>
</html>
