<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AmberTime 銘柄の検証</title>
<style>body{margin:12px;background:#28251f;color:#eee;font:14px system-ui}button,label{padding:10px;margin:3px;display:inline-block;min-height:44px}iframe{display:block;border:1px solid #aaa;width:390px;height:844px;max-width:none}p{max-width:65em}</style>
<p>検証用。通常の保存には触れず、このページ内のメモリだけを使います。</p>
<button data-case="new">新しい銘柄</button><button data-case="repeat">完売銘柄を再発売</button><button data-case="wholesale">卸売指定の樽</button><button id="reload" disabled>保存から再開</button><button id="phone">iPhone 390</button><button id="pc">PC 1280</button><label><input id="paused" type="checkbox" checked>手動停止で開く</label><p id="status"></p><iframe id="game" title="検証用 AmberTime"></iframe>
<script type="module">
import * as D from '../../partner-orders.mjs?v=0.11';
import {replayCheckpoint} from '../partners/replay.mjs';
const root=new URL('../../',location.href),frame=document.querySelector('#game'),status=document.querySelector('#status'),reload=document.querySelector('#reload');
let memory=new Map(),ready=false,selection=0,markup='';
window.qaStorage={getItem:k=>memory.get(k)??null,setItem:(k,v)=>memory.set(k,v)};
async function response(path,json=false){const r=await fetch(new URL(path,root),{cache:'no-store'});if(!r.ok)throw Error(path+' HTTP '+r.status);return json?r.json():r.text();}
function mount(){if(!ready)return;frame.srcdoc=markup.replace('<head>',`<head><base href="${root}"><script>Object.defineProperty(window,'localStorage',{value:parent.qaStorage});<\/script>`);}
function resolve(s){if(s.trade.offer)s=D.declineOffer(s);let guard=0;while(s.decisions.length){if(++guard>8)throw Error('判断が解消しません。');const d=s.decisions[0],o=d.pending.options.find(x=>x.id==='wait'||x.id==='last');if(!o)throw Error('対応が必要 '+d.eventId);s=D.chooseDistillery(s,d.caskId,o.id);}return s;}
function month(s){s=resolve(s);const m=s.core.month;s=D.tickDistillery(s);if(s.core.month!==m+1)throw Error('月次が進みません。');return resolve(s);}
function fill(s){s=D.startDistillation(resolve(s));while(s.still.distillation.progress<70)s=D.distillStep(s);return D.fillBarrel(D.stopDistillation(s),'refill');}
async function setup(kind){const token=++selection;ready=false;reload.disabled=true;memory=new Map();frame.srcdoc='';status.textContent='公開操作から状態を作成中です。';
 try{
  const [html,source]=await Promise.all([response('index.html'),response('tests/fixtures/partners-accepted.json',true)]);if(token!==selection)return;
  let s=D.enableBrands(replayCheckpoint(source,D));s=fill(s);let id=s.core.casks.at(-1).id;
  if(kind==='wholesale')s=D.assignCask(s,id,s.trade.relationship.terms[0].id);
  else {for(let i=0;i<6;i++)s=month(s);if(kind==='repeat'){
   s=D.bottleBranded(s,id,{name:'川霧',bottle:'slender',label:'dark'});const product=s.result.productId;s=D.listBottles(D.setSalePrice(s,'low',product),product);
   let guard=0;while(s.core.products.find(p=>p.id===product)?.stock>0){if(++guard>60)throw Error('完売しません。');s=month(s);}
   s=fill(s);id=s.core.casks.at(-1).id;for(let i=0;i<6;i++)s=month(s);
  }}
  D.serializeDistillery(s);if(token!==selection)return;markup=html;
  memory=new Map([['sukimastock.ambertime.wholesale.v8',JSON.stringify({version:1,game:s,userPaused:document.querySelector('#paused').checked})]]);ready=true;reload.disabled=false;
  status.textContent='正規操作・厳密保存。銘柄 '+s.brands.length+' · 発売回 '+s.releases.length+' · 樽 '+id+' を選んで検証。';mount();
 }catch(e){if(token!==selection)return;ready=false;memory=new Map();frame.srcdoc='';reload.disabled=true;status.textContent='検証停止：'+e.message;}
}
for(const b of document.querySelectorAll('[data-case]'))b.onclick=()=>setup(b.dataset.case);
reload.onclick=mount;document.querySelector('#phone').onclick=()=>{frame.style.width='390px';};document.querySelector('#pc').onclick=()=>{frame.style.width='1280px';};
</script></html>
