<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AmberTime 0.9 動作検証</title>
<style>body{margin:12px;background:#28251f;color:#eee;font:14px system-ui}button,label{padding:10px;margin:3px;display:inline-block}iframe{display:block;border:1px solid #aaa;width:390px;height:844px;max-width:100%}p{max-width:60em}button{min-height:44px}</style>
<p>検証用。通常の保存にはアクセスせず、このページ内のメモリだけを使います。</p>
<button data-fixture="initial">最初の申し出</button><button data-fixture="due">2樽の出荷前月</button><button data-fixture="proposal">取引先の条件提案</button><button id="legacy">旧保存の再開</button><button id="reload">保存から再開</button><button id="phone">iPhone 390</button><button id="pc">PC 1280</button><label><input id="paused" type="checkbox" checked>手動停止で開く</label><p id="status"></p><iframe id="game" title="検証用 AmberTime"></iframe>
<script type="module">
const root=new URL('../../',location.href),frame=document.querySelector('#game'),key='sukimastock.ambertime.wholesale.v5';let memory=new Map();
window.qaStorage={getItem:k=>memory.get(k)??null,setItem:(k,v)=>memory.set(k,v)};
const markup=await (await fetch(new URL('index.html',root),{cache:'no-store'})).text();
function mount(){frame.srcdoc=markup.replace('<head>',`<head><base href="${root}"><script>Object.defineProperty(window,'localStorage',{value:parent.qaStorage});<\/script>`);document.querySelector('#status').textContent='公開版と同じindex/appを隔離保存で表示しています。';}
for(const button of document.querySelectorAll('[data-fixture]'))button.onclick=async()=>{const game=await(await fetch(new URL('tests/fixtures/v09-'+button.dataset.fixture+'.json',root))).json();memory=new Map([[key,JSON.stringify({version:1,game,userPaused:document.querySelector('#paused').checked})]]);mount();};
document.querySelector('#legacy').onclick=async()=>{const game=await(await fetch(new URL('tests/fixtures/v08-legal-funds.json',root))).json();memory=new Map([['sukimastock.ambertime.wholesale.v3',JSON.stringify({version:1,game,userPaused:document.querySelector('#paused').checked})]]);mount();};
document.querySelector('#reload').onclick=mount;document.querySelector('#phone').onclick=()=>frame.style.width='390px';document.querySelector('#pc').onclick=()=>frame.style.width='1280px';
</script></html>
