<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AmberTime 業者別卸売 動作検証</title>
<style>body{margin:12px;background:#28251f;color:#eee;font:14px system-ui}button,label{padding:10px;margin:3px;display:inline-block}iframe{display:block;border:1px solid #aaa;width:390px;height:844px;max-width:100%}p{max-width:60em}button{min-height:44px}</style>
<p>検証用。通常の保存にはアクセスせず、このページ内のメモリだけを使います。</p>
<button data-fixture="offer">特別注文の申し出</button><button data-fixture="accepted">受注・樽未指定</button><button data-fixture="assigned">特別注文の樽</button><button data-fixture="due">成功する出荷の前月</button><button data-fixture="unmet">風味が未達</button><button id="legacy">0.9の申し出</button><button id="reload" disabled>保存から再開</button><button id="phone">iPhone 390</button><button id="pc">PC 1280</button><label><input id="paused" type="checkbox" checked>手動停止で開く</label><p id="status"></p><p id="diagnostic"></p><iframe id="game" title="検証用 AmberTime"></iframe>
<script type="module">
import {replayCheckpoint,firstDifference} from './replay.mjs';
import * as D from '../../partner-orders.mjs?v=0.10.1';
import * as V09 from '../../trade.mjs?v=0.9';
const root=new URL('../../',location.href),frame=document.querySelector('#game'),key='sukimastock.ambertime.wholesale.v6';let memory=new Map(),selection=0,ready=false;
window.qaStorage={getItem:k=>memory.get(k)??null,setItem:(k,v)=>memory.set(k,v)};
const markupResponse=await fetch(new URL('index.html',root),{cache:'no-store'});
if(!markupResponse.ok)throw Error('index.html HTTP '+markupResponse.status);
const markup=await markupResponse.text();
function clearSelection(){ready=false;memory=new Map();frame.srcdoc='';document.querySelector('#reload').disabled=true;document.querySelector('#status').textContent='';}
function mount(){if(!ready)return;frame.srcdoc=markup.replace('<head>',`<head><base href="${root}"><script>Object.defineProperty(window,'localStorage',{value:parent.qaStorage});<\/script>`);document.querySelector('#status').textContent='公開版と同じindex/appを隔離保存で表示しています。';}
async function loadFixture(path,engine,saveKey){
 const token=++selection;clearSelection();document.querySelector('#diagnostic').textContent='';document.querySelector('#status').textContent='検証対象を読み込み中です。';
 try{const response=await fetch(new URL(path,root),{cache:'no-store'});if(token!==selection)return;if(!response.ok)throw Error('HTTP '+response.status);const fixture=await response.json();if(token!==selection)return;let raw='読込成功';try{engine.restoreDistillery(JSON.stringify(fixture));}catch(e){raw=e.message;}
 const game=replayCheckpoint(fixture,engine),difference=firstDifference(fixture,game);
 document.querySelector('#diagnostic').textContent='元チェックポイント: '+raw+'。操作履歴からの再生成: 検証済。'+(difference?'最初の差 '+JSON.stringify(difference):'状態差なし。');
 if(token!==selection)return;memory=new Map([[saveKey,JSON.stringify({version:1,game,userPaused:document.querySelector('#paused').checked})]]);ready=true;document.querySelector('#reload').disabled=false;mount();
 }catch(e){if(token!==selection)return;clearSelection();document.querySelector('#status').textContent='検証を停止しています。';document.querySelector('#diagnostic').textContent='検証停止: '+e.message;}
}
for(const button of document.querySelectorAll('[data-fixture]'))button.onclick=()=>loadFixture('tests/fixtures/partners-'+button.dataset.fixture+'.json',D,key);
document.querySelector('#legacy').onclick=()=>loadFixture('tests/fixtures/v09-initial.json',V09,'sukimastock.ambertime.wholesale.v5');
document.querySelector('#reload').onclick=mount;document.querySelector('#phone').onclick=()=>{frame.style.maxWidth='none';frame.style.width='390px';};document.querySelector('#pc').onclick=()=>{frame.style.maxWidth='none';frame.style.width='1280px';};
</script></html>
