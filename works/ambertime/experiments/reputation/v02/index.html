<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#18232b"><title>AmberTime Reputation Lab 0.2</title><meta name="description" content="取扱いを受けた店への自動出荷と、ブランドごとの期待を比べるAmberTimeの独立実験。"><link rel="stylesheet" href="./style.css?v=0.2"><script type="module" src="./app.mjs?v=0.2"></script></head>
<body><main>
<header><a href="../../../../../lab/#room-bench">← LAB</a><h1>AmberTime <span>Reputation Lab 0.2</span></h1><p class="note">Staging実験・保存なし</p></header>
<section aria-label="時間と出荷"><div class="section-line"><output id="month"></output><span>発送の入金 <output id="receipts-total"></output></span></div><div class="actions month-actions"><button id="advance1">1か月進める</button><button id="advance3">3か月進める</button></div><p id="message" role="status" aria-live="polite"></p></section>
<section aria-label="ブランドとビン"><div class="form-row"><label>ブランド<select id="brand"></select></label><label>ビン<select id="release"></select></label></div><p id="brand-expectation" class="note"></p><p id="release-info"></p><details id="brand-panel"><summary>ブランドを作る</summary><div class="form-row"><label>名前<input id="brand-name" type="text" maxlength="40" autocomplete="off"></label><label id="brand-direction-label">味の方向<select id="brand-direction"></select></label></div><button id="create-brand">ブランドを作る</button></details><details id="release-panel"><summary>ビンの味と在庫</summary><div id="release-profile" class="profile"></div><div id="brand-stock"></div></details></section>
<section aria-label="取扱店"><div class="section-line"><h2>取扱店</h2><span class="note">架空の6店舗</span></div><div id="shops" class="shops"></div><p class="note">受けた店には、注文のある月に在庫から出荷します。</p></section>
<section aria-label="最近の自動出荷"><h2>最近の出荷</h2><div id="recent-shipments"></div><p id="order-status" class="note"></p></section>
<section aria-label="手動の仕込み"><details id="bottling-panel"><summary>たるからビンに残す</summary><div id="cask"></div><div class="form-row"><label>ブランド<select id="bottle-brand"></select></label><label>本数<input id="bottle-count" type="number" inputmode="numeric" min="1" step="1"></label></div><p id="bottle-quote"></p><button id="bottle">ビンに詰める</button></details><details id="batch-panel"><summary>次のたるを仕込む</summary><div class="form-row"><label>製法<select id="next-recipe"></select></label><label>たる<select id="next-cask"><option value="bourbon">バーボン</option><option value="refill" selected>リフィル</option></select></label></div><p id="batch-reason" class="note"></p><button id="start-batch">仕込む</button></details></section>
<section aria-label="経路と注文の記録"><details id="diagnostics-panel"><summary>経路・注文・出荷の記録</summary><h3>今月の注文</h3><div id="orders"></div><h3>出荷の記録</h3><div id="receipts"></div><h3>店への紹介</h3><div id="routes"></div></details></section>
<section aria-label="比較条件"><details id="conditions-panel"><summary>条件を替えて比較</summary><p class="note">変更・リセットで初期状態に戻ります。ブランド・履歴・メモも戻ります。</p><div class="form-row"><label>ブランドの期待<select id="method"></select></label><label>在庫が重なる時<select id="priority"></select></label><label>最初の製法<select id="initial-recipe"></select></label><label id="initial-direction-label">最初のブランドの方向<select id="initial-direction"></select></label><label>シード<input id="seed" type="number" min="1" max="4294967295" step="1" inputmode="numeric"></label><label>最初の月齢<input id="initial-age" type="number" min="0" max="120" step="1" inputmode="numeric" placeholder="製法の月齢"></label><label>最初の本数<input id="initial-count" type="number" min="1" step="1" inputmode="numeric" value="20"></label></div><button id="reset">初期状態へ戻す</button></details><details id="notes-panel"><summary>試した感想（任意）</summary><div class="notes"><label>自動出荷で気になったこと<textarea id="note-auto" rows="2"></textarea></label><label>ブランドで作り分けたくなったこと<textarea id="note-brand" rows="2"></textarea></label><label>次に仕込みたい・ビンに残したいもの<textarea id="note-next" rows="2"></textarea></label></div></details><button id="export">記録をJSONで保存</button></section>
<footer><a href="./REPORT.md">0.2比較報告</a><a href="./results.json">0.2数値結果</a><a href="../v01.html">0.1試作</a><a href="../../../index.html">本編を開く</a></footer>
</main></body></html>
