<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#18232b"><title>AmberTime Reputation Lab 0.1</title><meta name="description" content="同じビンをどこへ届けるか。6店舗のつながりと継続する納品を比べる独立実験。"><link rel="stylesheet" href="./style.css?v=0.1"><script type="module" src="./app.mjs?v=0.1"></script></head>
<body><main>
<header><a href="../../../../lab/#room-bench">← LAB</a><h1>AmberTime <span>Reputation Lab 0.1</span></h1><p class="note">Staging実験・保存なし</p></header>
<section aria-label="ビンと時間"><div class="section-line"><output id="month">開始時点</output><div class="actions"><button id="advance1">1か月進める</button><button id="advance3">3か月進める</button></div></div><label class="release-picker">届けるビン<select id="release"></select></label><p id="release-info"></p><div id="release-profile" class="profile"></div><p id="message" role="status" aria-live="polite"></p></section>
<section aria-label="店舗のつながり"><div class="section-line"><h2>届け先</h2><span class="note">架空の6店舗</span></div><div id="network" class="network"><svg id="routes" viewBox="0 0 600 400" preserveAspectRatio="none" aria-hidden="true"></svg><div id="nodes"></div></div><div id="destination"><h3 id="destination-name"></h3><p id="destination-status"></p><p id="destination-hint" class="note"></p><p id="destination-received" class="note"></p><p id="destination-route" class="note"></p><p id="destination-memory" class="note"></p><p id="destination-reason" class="note"></p><div id="offer-actions" class="actions" hidden><button id="accept">申し出を受ける</button><button id="decline">今回は見送る</button></div><div class="delivery-form"><label>納品本数<input id="count" type="number" inputmode="numeric" step="1" min="1"></label><div><p id="quote"></p><button id="deliver" class="primary">納品する</button></div></div><p id="quote-reason" class="note"></p><details><summary>今回の届け先を選んだ理由（任意）</summary><label>理由<textarea id="delivery-reflection" rows="2"></textarea></label></details></div></section>
<section aria-label="次のビン"><details id="cask-panel"><summary>たるから次のビンに残す</summary><div id="cask"></div><div class="delivery-form"><label>ビン詰め本数<input id="bottle-count" type="number" inputmode="numeric" min="1" step="1"></label><div><p id="bottle-quote"></p><button id="bottle">ビンに詰める</button></div></div><div id="next-recipe" hidden><label>次の製法<select id="next-recipe-choice"></select></label><button id="replace">次のたるを仕込む</button></div><p id="cask-reason" class="note"></p></details></section>
<section aria-label="届いた記録"><details id="events-panel"><summary>届いた記録 <span id="event-count"></span></summary><div id="events"></div></details></section>
<section aria-label="実験条件"><h2>条件を替えて比較</h2><p class="note">変更・リセットで初期状態に戻ります。履歴と感想も消えます。</p><div class="form-row"><label>方式<select id="mode"></select></label><label>最初の製法<select id="recipe"></select></label><label>シード<input id="seed" type="number" min="1" max="4294967295" step="1" inputmode="numeric"></label></div><details id="initial-panel"><summary>最初の条件</summary><div class="form-row"><label>最初の紹介先<select id="origin"><option value="normal">ふつうの開始</option></select></label><label>最初の月齢<input id="initial-age" type="number" min="0" max="120" step="1" placeholder="製法の月齢" inputmode="numeric"></label><label>最初のビン詰め本数<input id="initial-count" type="number" min="1" step="1" value="20" inputmode="numeric"></label></div></details><details id="baseline-panel"><summary>本編3店舗の判定</summary><p class="note">店舗への納品は、自家販売の実績に加えません。</p><div id="baseline"></div></details><button id="reset">初期状態へ戻す</button></section>
<section aria-label="試した感想"><details id="reflections-panel"><summary>試した感想（任意）</summary><div class="notes"><label>届け先で迷ったこと<textarea id="reflection-route" rows="2"></textarea></label><label>また届けたいと思った店<textarea id="reflection-repeat" rows="2"></textarea></label><label>次にビンに残したい味・時期<textarea id="reflection-next" rows="2"></textarea></label></div></details><button id="export">記録をJSONで保存</button></section>
<footer><a href="./REPORT.md">比較報告</a><a href="./results.json">数値結果</a><a href="../../">本編を開く</a></footer>
</main></body></html>
