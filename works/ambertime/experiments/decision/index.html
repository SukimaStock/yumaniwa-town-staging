<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#18232b"><title>AmberTime Decision Lab 0.1</title><meta name="description" content="熟成、ビン詰め、保管と販売、次の仕込みを比べるAmberTimeの独立実験。"><link rel="stylesheet" href="./style.css?v=0.1"><script type="module" src="./app.mjs?v=0.1"></script></head>
<body><main>
<header><a href="../../../../lab/#room-bench">← LAB</a><h1>AmberTime <span>Decision Lab 0.1</span></h1><p class="note">Staging実験・保存なし</p></header>
<section aria-label="時間と資金"><div class="section-line"><output id="date"></output><span id="season"></span></div><p id="season-hint" class="note"></p><dl class="finance"><div><dt>資金</dt><dd id="cash"></dd></div><div><dt>空き</dt><dd id="capacity"></dd></div><div><dt>月の維持費</dt><dd id="upkeep"></dd></div><div><dt>ビン詰めの備え</dt><dd id="reserve"></dd></div></dl><div class="actions"><button id="advance1">1か月進める</button><button id="advance6">6か月進める</button></div><p id="last-month" class="note"></p><p id="message" role="status" aria-live="polite"></p></section>
<section aria-label="貯蔵庫"><div class="section-line"><h2>貯蔵庫</h2><span id="elapsed" class="note"></span></div><div id="casks" class="casks"></div><div class="selection"><div class="section-line"><h3 id="selected">たるを選ぶ</h3><button id="sample">試飲する</button></div><p id="tasting" class="note"></p><div class="bottle-row"><label>ビン詰め本数<input id="bottle-count" type="number" inputmode="numeric" min="1" step="1"></label><div><p id="bottle-quote"></p><button id="bottle" class="primary">ビンに詰めて保管</button></div></div><p id="bottle-reason" class="note"></p><details id="reasons-panel"><summary>今回の理由を残す（任意）</summary><div class="notes"><label>今、詰める理由<textarea id="note-why" rows="2"></textarea></label><label>もう少し待ちたかったこと<textarea id="note-wait" rows="2"></textarea></label><label>次に試したいこと<textarea id="note-next" rows="2"></textarea></label></div></details></div>
<details id="recipe-panel"><summary>次の仕込み</summary><div class="form-row"><label>抽出を止める位置<select id="recipe-stop"><option value="30">30%</option><option value="50">50%</option><option value="66" selected>66%</option><option value="99">99%</option></select></label><label>たる<select id="recipe-type"><option value="bourbon">バーボン</option><option value="refill" selected>リフィル</option></select></label></div><p id="start-cost"></p><p id="start-reason" class="note"></p><button id="start">仕込んでたるに詰める</button></details></section>
<section aria-label="ビンの保管と販売"><h2>ビン</h2><div id="products"></div><p class="note">販売中のビンは、次の月から売上に変わります。</p></section>
<section aria-label="判断の記録"><details id="history-panel"><summary>判断の記録 <span id="history-count"></span></summary><div id="latest"></div><div id="history"></div></details></section>
<section aria-label="実験条件"><h2>条件を替えて比較</h2><p class="note">変更・リセットで同じシードの初期状態に戻ります。履歴とメモも消えます。</p><div class="form-row"><label>条件<select id="condition"></select></label><label>初期状態<select id="fixture"></select></label><label>シード<input id="seed" type="number" min="1" max="4294967295" step="1" inputmode="numeric"></label></div><p id="condition-note" class="note"></p><button id="reset">初期状態へ戻す</button><details id="overall-panel"><summary>全体のメモ（任意）</summary><label>試して分かったこと<textarea id="overall-notes" rows="3"></textarea></label></details><button id="export">記録をJSONで保存</button></section>
<footer><a href="./REPORT.md">比較報告</a><a href="./results.json">数値結果</a><a href="../../">本編を開く</a></footer>
</main></body></html>
