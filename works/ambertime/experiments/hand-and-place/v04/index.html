<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>AmberTime 手札と場 Lab 0.4 — 店からの注文</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><a href="../../../../../lab/">LAB</a><h1>手札と場 <small>0.4</small></h1><span id="date">0年</span><button id="settings" aria-label="条件と記録を開く">設定</button></header>
<section aria-labelledby="order-title"><div class="line"><h2 id="order-title">店からの注文</h2><span>希望以外の一本も渡せます</span></div><div id="orders"></div></section>
<section aria-labelledby="hand-title"><div class="line"><h2 id="hand-title">手札</h2><label><input id="archive" type="checkbox">過去の一本</label></div><div id="hand"></div></section>
<section id="action" aria-label="注文にウイスキーを渡す"><p id="pair">注文と、渡す一本を選ぶ</p><div class="delivery-actions"><button id="deliver" disabled>渡す</button><button id="decline" disabled>今回は見送る</button></div><div id="result" role="status" aria-live="polite"></div></section>
<div class="under"><button id="detail" disabled>選んだ一本の製法・再仕込み</button><button id="production">熟成中 <span id="job-count">1</span>樽</button></div>
<div class="clock"><button id="main-step">1か月進める</button><button id="main-play" aria-pressed="false">時間を流す</button><span>1か月＝3秒</span></div><p id="barrel-hint"></p>
<details id="records"><summary>条件・操作ログ</summary><label>初期条件 <select id="scenario"><option value="standard">各6本・樽は22か月</option><option value="scarce">手札少なめ・樽は23か月</option></select></label><p>条件を変えると最初から始めます。注文は待っても見送っても構いません。</p><button id="export">ログを書き出す</button><label class="file">ログを再現<input id="import" type="file" accept=".json,application/json"></label><button id="reset">最初から</button><p id="counts"></p><p>シード <span id="seed">42</span>。価格・売上・評判・勝敗は計算しません。自動納品はありません。</p><p><a href="../v03/">Lab 0.3と比べる</a> · <a href="REPORT.md">検証レポート</a></p><div id="history"></div></details>
</main><dialog id="modal"><div id="modal-body"></div><button id="close">閉じる</button></dialog><script type="module" src="app.mjs"></script></body></html>
