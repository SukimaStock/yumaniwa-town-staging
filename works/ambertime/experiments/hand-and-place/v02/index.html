<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>AmberTime 手札と場 Lab 0.2</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><a href="../../../../../lab/">LAB</a><h1>手札と場 <small>0.2</small></h1><span id="date">0年</span><button id="settings" aria-label="比較条件と記録を開く">設定</button></header>
<section id="board-section" aria-labelledby="board-title"><div class="line"><h2 id="board-title">場</h2><span id="condition">A 自由配置</span></div><div id="board"></div></section>
<section id="hand-section" aria-labelledby="hand-title"><div class="line"><h2 id="hand-title">手札</h2><label><input id="archive" type="checkbox">過去の一本</label></div><div id="hand"></div></section>
<section id="action" aria-label="選んだ一枚を出す"><p id="pair">手札と店を選ぶ</p><button id="propose" disabled>この一枚を出す</button><div id="result" role="status" aria-live="polite"></div><div id="replacement"></div></section>
<div class="under"><button id="detail" disabled>選んだ一本の製法・再仕込み</button><button id="production">仕込みと時間 <span id="job-count">0</span></button></div>
<details id="records"><summary>比較条件・操作ログ</summary><div class="options"><label>配置条件<select id="allocation"><option value="free">A 自由配置</option><option value="reserve">B 翌月分を確保</option></select></label><label>最初の手札<select id="scenario"><option value="full">3種類</option><option value="wood-only">樽香の一本だけ</option></select></label></div><p id="condition-help"></p><p>条件を切り替えると、最初から始めます。</p><button id="export">ログを書き出す</button><label class="file">ログを再現<input id="import" type="file" accept=".json,application/json"></label><button id="reset">最初から</button><p id="counts"></p><p>シード <span id="seed">42</span>・各店は月2本。費用・売上・口コミは計算しません。試遊状態はログに書き出せます。</p><p><a href="../v01/">Lab 0.1と比べる</a> · <a href="REPORT.md">検証レポート</a></p><div id="history"></div></details>
</main><dialog id="modal"><div id="modal-body"></div><button id="close">閉じる</button></dialog><script type="module" src="app.mjs"></script></body></html>
