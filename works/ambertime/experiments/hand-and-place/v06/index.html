<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>AmberTime 手札と場 Lab 0.6 — 在庫の行き先と自由な取引</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><a href="../../../../../lab/">LAB</a><h1>手札と場 <small>0.6</small></h1><span id="date">0年</span><button id="settings" aria-label="条件と記録を開く">設定</button></header>
<nav id="modes" aria-label="取引方式"><button data-mode="A" aria-pressed="false">A 注文</button><button data-mode="B" aria-pressed="false">B 配分</button><button data-mode="C" aria-pressed="true">C 自由</button></nav>
<section aria-labelledby="shop-title"><div class="line"><h2 id="shop-title">店</h2><span>希望は待っても構いません</span></div><div id="orders"></div></section>
<section aria-labelledby="hand-title"><div class="line"><h2 id="hand-title">手札</h2><label><input id="archive" type="checkbox">過去の一本</label></div><div id="hand"></div></section>
<section id="action" aria-label="在庫の行き先を選ぶ"><p id="pair">手札から一本を選ぶ</p><div id="destinations"><button data-dest="retail">自家販売へ</button><button data-dest="restaurant">レストランへ</button><button data-dest="liquor">酒屋へ</button><button data-dest="hand">手元へ戻す</button></div><div class="quantity"><label for="quantity">本数</label><input id="quantity" type="number" min="1" step="1" value="2" inputmode="numeric"><button data-qty="all">全部</button><button id="deliver" disabled>行き先を選ぶ</button></div><div id="result" role="status" aria-live="polite"></div></section>
<section id="retail-section" aria-labelledby="retail-title"><div class="line"><h2 id="retail-title">自家販売</h2><span>配分した分から、全体で月1本</span></div><div id="retail"></div></section>
<div class="clock"><button id="main-step">1か月進める</button><button id="main-play" aria-pressed="false">時間を流す</button><span id="clock-status">停止中 · 1か月＝3秒</span></div><p id="barrel-hint"></p>
<div class="under"><button id="detail" disabled>選んだ一本の製法・再仕込み</button><button id="production">熟成中 <span id="job-count">1</span>樽</button></div>
<details id="records"><summary>条件・操作ログ</summary><label>初期条件 <select id="scenario"><option value="standard">各6本・樽は22か月</option><option value="scarce">手札少なめ・樽は23か月</option></select></label><p>方式・条件を変えると最初から始めます。</p><button id="export">ログを書き出す</button><label class="file">ログを再現<input id="import" type="file" accept=".json,application/json"></label><button id="reset">最初から</button><p id="counts"></p><p>シード <span id="seed">42</span>。自家販売の未販売分はCで戻せます。売れた分・店へ渡した分は戻りません。</p><p><a href="../v05/">Lab 0.5と比べる</a> · <a href="REPORT.md">検証レポート</a></p><div id="history"></div></details>
</main><dialog id="modal"><div id="modal-body"></div><button id="close">閉じる</button></dialog><script type="module" src="app.mjs"></script></body></html>
