<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta name="robots" content="noindex,nofollow">
 <meta name="theme-color" content="#252d32">
 <title>AmberTime｜お店のつながり Lab M1-A・呼吸する店</title>
 <link rel="stylesheet" href="./style.css">
</head>
<body>
 <main class="shell">
  <header class="heading"><div><p class="eyebrow">AmberTime / M1-A</p><h1>お店のつながり</h1></div><span class="lab-tag">比較 Lab</span></header>
  <p class="intro">つながった店だけが、ゆっくり呼吸する。</p>
  <section class="controls" aria-label="比較条件">
    <fieldset class="choice"><legend>出来事</legend><div id="scenarios" class="choice-buttons"></div></fieldset>
    <fieldset class="choice"><legend>地図の見方</legend><div class="choice-buttons"><button type="button" data-view="normal" aria-pressed="false">町を眺める</button><button type="button" data-view="relation" aria-pressed="true">関係を見る</button></div></fieldset>
  </section>
  <section class="map-panel" aria-label="町の地図と店舗情報">
   <div class="map-header"><span id="map-caption">町・7か月目</span><span class="zoom-controls"><button type="button" id="overview" aria-label="町の全景へ戻す">全景</button><button type="button" id="minus" aria-label="地図を縮小">−</button><button type="button" id="plus" aria-label="地図を拡大">＋</button></span></div>
   <div class="map-window" id="map-window" aria-label="町の地図。店を選択できます。2本指で拡大・移動できます。">
     <div class="map-layer" id="map-layer">
       <canvas id="map-canvas" width="144" height="144" role="img" aria-label="AmberTimeの町のドット絵地図"></canvas>
       <div id="breath-layer" class="breath-layer" aria-hidden="true"></div>
       <div id="map-pins" class="map-pins"></div>
     </div>
   </div>
   <div class="map-foot" id="map-foot">建物を選ぶと、その店の記録が見られます。</div>
  </section>
  <section class="detail" aria-label="選択した店舗の情報">
    <div class="detail-top"><div><span class="minor">選んだお店</span><h2 id="shop-title">路地裏のバー</h2></div><span id="detail-tag" class="detail-tag">取扱店</span></div>
    <div id="shop-message" class="shop-message" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="relation-controls" class="relation-controls" hidden>
      <fieldset class="choice compact"><legend>呼吸の比較</legend><div class="choice-buttons"><button type="button" data-style="together" aria-pressed="true">A 同時</button><button type="button" data-style="reply" aria-pressed="false">B 呼応</button><button type="button" data-style="partner" aria-pressed="false">C 相手だけ</button></div></fieldset>
      <div class="relation-actions"><button type="button" id="follow" class="follow" hidden></button></div>
    </div>
  </section>
  <footer class="notes"><span>検証用の固定シナリオ · ゲーム本編ではありません</span><details><summary>このLabについて</summary><p id="scenario-description"></p><p>経済・保存・時間進行はありません。実際の口コミ到達を検証できた場合だけ関係する店が呼吸します。建物のある酒店は実物のドット絵を拡大し、建物のないバーは現行M0の仮の選択枠だけを動かします。点線・暗転・自動ズームはありません。</p></details></footer>
 </main>
 <script type="module" src="./app.mjs"></script>
</body>
</html>
