<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>視覚Lab 0.4 表示確認</title><style>body{margin:0;background:#666;color:#fff;font:16px sans-serif}nav{display:flex;gap:8px;padding:6px}button,a{font:inherit;padding:8px}iframe{display:block;border:0;width:360px;height:568px;background:#1b2d2e}</style><nav><button data-w="360" data-h="568">360px</button><button data-w="375" data-h="620">375px</button><button data-w="390" data-h="680">390px</button><a href="./">Labへ</a></nav><iframe id="phone" title="iPhone幅の視覚Lab" src="./"></iframe><script type="module">const frame=document.getElementById('phone');for(const b of document.querySelectorAll('button'))b.addEventListener('click',()=>{frame.style.width=b.dataset.w+'px';frame.style.height=b.dataset.h+'px';for(const x of document.querySelectorAll('button'))x.setAttribute('aria-pressed',String(x===b));});</script></html>
