<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#1b2d2e">
  <title>AmberTime マップ Lab 0.5</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <header><a href="../../../../../lab/" aria-label="LABへ戻る">LABへ</a><h1>マップ Lab <small>0.5</small></h1><span id="month">0か月</span><button type="button" id="open-map">マップ</button><button type="button" id="close-map" hidden>販売室へ</button></header>
  <div id="map-view" hidden>
    <div class="map-toolbar"><label class="sr-only" for="map-range">地図の範囲</label><select id="map-range"><option value="2">近所</option><option value="3">町</option></select>
    <nav id="map-modes" aria-label="表示案"><button type="button" data-map-mode="numbers" aria-pressed="true">A 数字</button><button type="button" data-map-mode="symbols" aria-pressed="false">B 印</button><button type="button" data-map-mode="reaction" aria-pressed="false">C 数字と反応</button></nav></div>
    <p id="map-period"></p>
    <div id="map-surface"><canvas id="town-map" width="144" height="144" role="img" aria-label="AmberTimeの近所・町の地図"></canvas><div id="map-pins"></div></div>
    <p id="map-empty">納品した店に印が付きます。</p>
    <p class="map-note">3店はLab仮配置。範囲は比較用です。</p><p id="map-symbol-legend" hidden></p>
    <section id="map-report" hidden aria-label="店からの報告"><div id="map-report-body"></div></section>
  </div>
  <section id="workbench" aria-label="手元から店へ">
    <div class="shelf-heading"><h2>手元</h2><span id="price"></span></div>
    <div id="hand" class="hand" aria-label="手元の瓶"></div>
    <div id="allocation-view">
      <div id="portions" class="portions" aria-label="置く本数"><button type="button" data-portion="1" aria-pressed="true">1本</button><button type="button" data-portion="5" aria-pressed="false">5本</button><button type="button" data-portion="all" aria-pressed="false">全部</button></div>
      <div id="shops" class="shops" aria-label="届ける店"></div>
      <div class="draft-actions"><button type="button" id="undo">ひとつ戻す</button><button type="button" id="cancel">配分を戻す</button><button type="button" id="confirm">配分を確定</button></div>
    </div>
    <div id="result-view" hidden>
      <div class="result-heading"><h2>販売と評価</h2><button type="button" id="back-to-allocation">瓶を置く・回収</button></div>
      <div id="results" aria-label="店ごとの販売結果"></div>
      <div id="customer" aria-live="polite"></div>
    </div>
    <p id="store-memory" hidden aria-live="polite"></p>
    <div class="time-actions"><button type="button" id="advance-one">1か月進める</button><button type="button" id="advance-three">3か月進める</button></div>
    <div id="replay-controls" hidden><button type="button" id="replay-back">前へ</button><span id="replay-position"></span><button type="button" id="replay-next">次へ</button></div>
    <button type="button" id="open-next" class="next-button" hidden>次の一本を試す</button>
  </section>
  <section id="next-editor" hidden aria-labelledby="next-title">
    <div class="editor-heading"><h2 id="next-title">次の試作（熟成済み5本）</h2><button type="button" id="close-next" aria-label="次の試作を閉じる">閉じる</button></div>
    <form id="next-form">
      <label>製法<select id="next-sample" name="sample"></select></label>
      <label>熟成年数<select id="next-years" name="years"></select></label>
      <label>価格<select id="next-tier" name="tier"></select></label>
      <button type="submit">この一本を用意する</button>
    </form>
  </section>
  <p id="error" role="alert" hidden></p>
  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  <div class="supporting">
    <details id="history"><summary>前の一本・記録</summary><p id="previous-brief" hidden></p><div id="previous"></div></details>
    <details id="store-info"><summary>店情報</summary><div id="store-description"></div><div id="store-memory-details"></div></details>
    <details id="comparison-settings"><summary>4つの経過を比べる</summary>
      <form id="scenario-form">
        <label>同じ条件の経過<select id="scenario-choice"></select></label>
        <label>届ける店<select id="scenario-shop"></select></label>
        <label>記憶モデル<select id="memory-policy"></select></label>
        <button type="submit">この経過を見る</button>
      </form>
      <p>同じシードの納品直後と販売後を、前へ・次へで見比べます。今の操作記録は置き換わります。</p>
    </details>
    <details id="details"><summary>評価の詳細・ログ</summary>
      <div id="diagnostics"></div>
      <button type="button" id="advance-year">12か月進める</button>
      <div class="log-actions"><button type="button" id="export-json">JSONを書き出す</button><button type="button" id="export-csv">購入CSV</button><button type="button" id="export-memory-csv">店の記録CSV</button></div>
      <label class="file-label">JSONから再現<input type="file" id="import-json" accept="application/json,.json"></label>
      <form id="restart-form"><label>シード<input id="seed" type="number" min="1" max="4294967295" step="1" required></label><button type="submit">初期状態から試す</button></form>
      <a href="./REPORT.md">検証レポート</a>
    </details>
  </div>
  <footer>独立Lab。本編の記録には接続していません。</footer>
</main>
<script type="module" src="./app.mjs"></script>
</body>
</html>
