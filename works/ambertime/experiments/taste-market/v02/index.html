<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>AmberTime｜味と店 Lab 0.2</title><meta name="description" content="発売回の瓶を店へ割り当て、売れていく手応えを試す独立Lab。"><link rel="stylesheet" href="style.css"></head>
<body><main><header><a href="../v01/">← Lab 0.1</a><h1>AmberTime <span>味と店 Lab 0.2</span></h1></header>
<div class="clock"><span id="date"></span><span id="cash"></span><button id="month">1か月進める</button></div>
<section aria-label="発売回"><div id="releases" class="releases"></div><div class="hand"><span id="selected"></span><span>手元 <output id="hand"></output>本</span></div><div id="portions" class="buttons" aria-label="一度に置く本数"></div></section>
<section aria-label="割り当て先"><p class="hint">店をタップして割り当て。売れるまで戻せます。</p><div id="shops" class="shops"></div></section>
<p id="notice" role="status" aria-live="polite"></p>
<section><h2>次の一本を造る</h2><div id="brew" class="buttons"></div></section>
<details><summary>記録と実験条件</summary><ol id="history"></ol><div class="buttons"><button id="export">ログを書き出す</button><label class="import">ログを再現<input id="import" type="file" accept="application/json,.json"></label><button id="reset">最初から</button></div><p class="hint">1回18本、1本£12の仮モデル。店の向こうの客への販売を、店への瓶の移動で表します。本編の保存・経済には接続しません。</p><a href="REPORT.md">実験条件</a></details>
</main><script type="module" src="app.mjs"></script></body></html>
