<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AmberTime｜取引のつづき Lab 0.1</title><style>
:root{color-scheme:dark;--bg:#1d2430;--panel:#303444;--line:#a4a7aa;--gold:#ead08a;--mint:#a9c5b2;--dim:#b9b9bf;--white:#f4eee2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:'Courier New',monospace;font-size:15px;line-height:1.5}button,select,input{font:inherit}button{touch-action:manipulation;min-height:42px;color:var(--white);border:2px solid #92939d;border-radius:0;background:#3a4050;padding:7px 9px;cursor:pointer}button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}button:disabled{opacity:.38;cursor:default}.wrap{width:min(100%,520px);margin:auto;padding:12px 12px max(24px,env(safe-area-inset-bottom))}.hud{border:3px solid #d4cfcb;padding:7px 10px;background:#292e3d;display:flex;align-items:center;justify-content:space-between;gap:8px}.hud b{color:var(--gold);font-size:16px}h1{font-size:16px;font-weight:normal;text-align:center;margin:12px 0 8px}.controls{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}button.on{color:#201e21;background:var(--gold);border-color:var(--gold)}.hint{min-height:23px;font-size:13px;color:var(--dim);margin:7px 0}.section-title{font-size:13px;color:var(--gold);margin:12px 0 6px}.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.lot{min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;user-select:none;-webkit-user-select:none;touch-action:none}.lot[aria-pressed=true]{border-color:var(--gold);background:#5b4e42}.lot .bottle{display:block;position:relative;width:19px;height:30px;background:var(--bottle);border:3px solid #ddd0a4;box-shadow:3px 3px 0 #20252d;image-rendering:pixelated}.lot .bottle:before{content:'';position:absolute;top:-10px;left:3px;width:7px;height:7px;background:#ddd0a4}.lot small,.shop small{font-size:12px;color:#ddd1bd}.lot strong{font-size:13px}.shophdr{display:flex;justify-content:space-between;gap:4px;align-items:center}.shops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.shop{min-height:96px;padding:7px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:4px;touch-action:none}.shop .name{font-size:14px}.shop .status{color:var(--mint);font-size:12px}.shop[data-active=true]{border-color:var(--mint)}.shop.targeting{border-color:var(--gold);background:#66553f}.shop .icon{font-size:18px;margin-right:4px}.notice{margin:10px 0;min-height:46px;padding:8px 9px;border:2px solid #777c88;background:#262c38;font-size:13px}.notice.error{border-color:#b99084;color:#f0d1bf}.slider{padding:9px;border:2px solid #646b76;margin-top:8px}.slider[hidden]{display:none}.slider input{width:100%;accent-color:var(--gold);touch-action:pan-x}.slider .choices{display:flex;justify-content:space-between;font-size:11px}.row{display:flex;gap:6px;margin-top:10px;align-items:stretch}.row button{flex:1;font-size:13px}.timeline{margin-top:10px;border:2px solid #596170;background:#252c38;padding:8px;max-height:120px;overflow:auto;min-height:74px;font-size:12px}.timeline p{margin:3px 0}.stats{display:flex;justify-content:space-between;gap:5px;color:var(--dim);font-size:12px;margin:9px 0}.mode{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.mode button{font-size:13px;min-height:44px;padding:5px 1px}svg#guide{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:visible}svg#guide line{stroke:#ead08a;stroke-width:4;stroke-dasharray:7 5;stroke-linecap:square}.foot{font-size:11px;color:#aeb5c0;margin:12px 0 0}#download{flex:0 0 auto}@media(min-width:520px){.wrap{padding-top:22px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="wrap"><div class="hud"><b>AMBER TIME</b><span id="month">1年目・1月</span><span id="total">累計 0本</span></div><h1>取引のつづき　Lab 0.1</h1><div class="section-title">操作を比べる</div><div class="mode" id="modes"><button data-mode="tap" class="on" aria-pressed="true">タップ</button><button data-mode="slide" aria-pressed="false">スライド</button><button data-mode="drag" aria-pressed="false">ドラッグ</button><button data-mode="line" aria-pressed="false">線で結ぶ</button></div><p class="hint" id="hint">瓶を選び、届けたい店をタップ</p><div class="section-title">瓶を選ぶ</div><div class="shelf" id="shelf"></div><div class="slider" id="slider" hidden><label for="range">届け先：<strong id="sliderName">町の酒店</strong></label><input id="range" type="range" min="0" max="3" step="1" value="0"/><div class="choices"><span>酒店</span><span>スーパー</span><span>バー</span><span>食堂</span></div><button id="slideConfirm" style="width:100%;margin-top:7px">この店と取引する</button></div><div class="section-title shophdr"><span>店との関係</span><span>初回だけ選ぶ・以後は自動</span></div><div class="shops" id="shops"></div><div id="notice" class="notice" role="status" aria-live="polite">最初の一本を、どの店に届けますか。</div><div class="row"><button id="next">1か月進める</button><button id="year">12か月進める</button></div><div class="row"><button id="restock">同じ製法で次のビン詰め</button><button id="reset">最初から</button><button id="download">ログ</button></div><div class="stats"><span id="ops">取引操作 0回</span><span id="relationships">継続 0店</span><span id="paused">休止 0店</span></div><div class="timeline" id="log" aria-label="直近の動き"></div><p class="foot">独立した操作試作です。AmberTime本編の保存・需要・価格・実在の取扱条件には接続していません。操作回数は入力イベントから算出した比較用の目安です。</p></main><svg id="guide" aria-hidden="true"><line id="stroke" x1="0" y1="0" x2="0" y2="0" opacity="0"/></svg><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),stores=[{id:'liquor',name:'町の酒店',icon:'▣',min:3,demand:3},{id:'super',name:'スーパー',icon:'▤',min:10,demand:6},{id:'bar',name:'路地のバー',icon:'▥',min:2,demand:2},{id:'diner',name:'食堂',icon:'▦',min:2,demand:3}],recipes=[{id:'fruit',name:'果実',color:'#c8835f'},{id:'grain',name:'穀物',color:'#d7b977'},{id:'malt',name:'麦芽',color:'#a991cc'}];
let s,selected=null,mode='tap',pointer=null,slideIndex=0;const log=(t)=>{s.log.unshift(''+s.month+'か月目 · '+t);s.log=s.log.slice(0,18)};function fresh(){s={month:1,ops:0,totalSold:0,relations:{},lots:[{id:1,recipe:'fruit',n:1,stock:18},{id:2,recipe:'grain',n:1,stock:16},{id:3,recipe:'malt',n:1,stock:12}],log:[]};selected=null;log('販売室を開きました');render();notice('最初の一本を、どの店に届けますか。')}
function getLot(id){return s.lots.find(x=>x.id===+id)}function recipeName(id){return recipes.find(x=>x.id===id)?.name||id}function pick(id){selected=getLot(id)?.id??null;render();if(selected)notice(recipeName(getLot(selected).recipe)+'を選びました');}
function initialSupply(rel,lot){const store=stores.find(x=>x.id===rel.store),amount=Math.min(store.min,lot.stock);if(amount<store.min)return false;lot.stock-=amount;s.totalSold+=amount;rel.sent+=amount;rel.lastLot=lot.id;return amount}
function connect(storeId,gestureOps){const shop=stores.find(x=>x.id===storeId),lot=getLot(selected);if(!lot||!shop)return notice('先に瓶を選んでください。',true);if(s.relations[storeId]&&s.relations[storeId].recipe===lot.recipe){notice(shop.name+'では、すでに'+recipeName(lot.recipe)+'を扱っています');return}if(lot.stock<shop.min){notice(shop.name+'への初回納品には'+shop.min+'本必要です',true);return}
const prior=s.relations[storeId],rel={store:storeId,recipe:lot.recipe,sent:0,lastLot:null,paused:false};s.relations[storeId]=rel;const n=initialSupply(rel,lot);s.ops+=gestureOps;log(shop.name+'へ'+recipeName(lot.recipe)+'を'+n+'本。'+(prior?'取扱いを変更':'取扱い開始'));notice(shop.name+'へ'+n+'本。次からは同じ製法を自動で届けます。');render()}
function monthly(){s.month++;for(const shop of stores){const r=s.relations[shop.id];if(!r)continue;let need=shop.demand,shipped=0;for(const lot of s.lots.filter(x=>x.recipe===r.recipe&&x.stock>0).sort((a,b)=>a.id-b.id)){let n=Math.min(need,lot.stock);lot.stock-=n;need-=n;shipped+=n;r.lastLot=lot.id;if(!need)break}if(shipped){r.sent+=shipped;s.totalSold+=shipped;if(r.paused)log(shop.name+'の発送が再開');r.paused=false}else if(!r.paused){r.paused=true;log(shop.name+'は在庫待ち（取引継続）')}}}
function advance(months){for(let i=0;i<months;i++)monthly();log(months+'か月進めました');render();notice(months+'か月進めました。店ごとの発送状況を確認できます。')}
function restock(){let a=selected&&getLot(selected);if(!a){const rel=Object.values(s.relations).find(x=>x.paused);a=rel?s.lots.find(l=>l.recipe===rel.recipe):s.lots[0]}if(!a)return;const siblings=s.lots.filter(x=>x.recipe===a.recipe),nextN=Math.max(...siblings.map(x=>x.n))+1;const newLot={id:Math.max(...s.lots.map(x=>x.id))+1,recipe:a.recipe,n:nextN,stock:20};s.lots.push(newLot);selected=newLot.id;log(recipeName(a.recipe)+' 第'+nextN+'回を20本ビン詰め');render();notice('同じ製法の新しい発売回です。次の月から取引中の店へ自動発送します。')}
function notice(t,error=false){$('notice').textContent=t;$('notice').classList.toggle('error',error)}function render(){const oldscroll=$('log').scrollTop;$('month').textContent=Math.ceil(s.month/12)+'年目・'+((s.month-1)%12+1)+'月';$('total').textContent='累計 '+s.totalSold+'本';$('shelf').innerHTML=s.lots.slice(-6).map(l=>`<button class="lot" data-lot="${l.id}" aria-pressed="${l.id===selected}" style="--bottle:${recipes.find(r=>r.id===l.recipe).color}"><span class="bottle" aria-hidden="true"></span><strong>${recipeName(l.recipe)} 第${l.n}回</strong><small>${l.stock}本</small></button>`).join('');$('shops').innerHTML=stores.map(x=>{const r=s.relations[x.id];return `<button class="shop" data-shop="${x.id}" data-active="${!!r}"><span class="name"><span class="icon">${x.icon}</span>${x.name}</span><span class="status">${!r?'取扱前':r.paused?'在庫待ち・関係は継続':recipeName(r.recipe)+'・自動発送中'}</span><small>${r?('累計 '+r.sent+'本'):'初回 '+x.min+'本'}</small></button>`}).join('');$('log').innerHTML=s.log.map(t=>'<p>'+t+'</p>').join('');$('log').scrollTop=oldscroll;$('ops').textContent='取引操作 '+s.ops+'回';$('relationships').textContent='継続 '+Object.keys(s.relations).length+'店';$('paused').textContent='休止 '+Object.values(s.relations).filter(r=>r.paused).length+'店';$('slider').hidden=mode!=='slide'||selected===null;}
function modeSet(m){mode=m;pointer=null;for(const b of $('modes').querySelectorAll('button')){b.classList.toggle('on',b.dataset.mode===m);b.setAttribute('aria-pressed',String(b.dataset.mode===m))}$('hint').textContent=({tap:'瓶を選び、届けたい店をタップ',slide:'瓶を選び、つまみで店を指定',drag:'瓶をそのまま店までドラッグ',line:'瓶から店まで線を引く'})[m];render()}
$('modes').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)modeSet(b.dataset.mode)});$('shelf').addEventListener('click',e=>{if(pointer?.moved)return;const b=e.target.closest('[data-lot]');if(b)pick(b.dataset.lot)});$('shops').addEventListener('click',e=>{if(pointer?.moved)return;const b=e.target.closest('[data-shop]');if(b&&mode==='tap')connect(b.dataset.shop,2)});$('next').onclick=()=>advance(1);$('year').onclick=()=>advance(12);$('restock').onclick=restock;$('reset').onclick=fresh;
$('range').addEventListener('input',e=>{slideIndex=+e.target.value;$('sliderName').textContent=stores[slideIndex].name});$('slideConfirm').onclick=()=>{if(mode==='slide')connect(stores[slideIndex].id,2)};
const stroke=$('stroke'),center=(e)=>{const r=e.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};
$('shelf').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-lot]');if(!b||!['drag','line'].includes(mode))return;selected=+b.dataset.lot;pointer={id:e.pointerId,from:b,startX:e.clientX,startY:e.clientY,moved:false};b.setPointerCapture(e.pointerId);let p=center(b);stroke.setAttribute('x1',p.x);stroke.setAttribute('y1',p.y);stroke.setAttribute('x2',p.x);stroke.setAttribute('y2',p.y);stroke.setAttribute('opacity','0')});
$('shelf').addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id)return;const dist=Math.hypot(e.clientX-pointer.startX,e.clientY-pointer.startY);if(dist>8)pointer.moved=true;if(mode==='line'&&pointer.moved){stroke.setAttribute('x2',e.clientX);stroke.setAttribute('y2',e.clientY);stroke.setAttribute('opacity','1')}document.querySelectorAll('.shop').forEach(n=>n.classList.toggle('targeting',pointer.moved&&document.elementFromPoint(e.clientX,e.clientY)?.closest('.shop')===n))});
function release(e){if(!pointer||e.pointerId!==pointer.id)return;const p=pointer;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-shop]');stroke.setAttribute('opacity','0');document.querySelectorAll('.shop').forEach(n=>n.classList.remove('targeting'));pointer=null;if(p.moved){if(target){connect(target.dataset.shop,1)}else{pick(p.from.dataset.lot);notice('瓶を店へ動かすと取引を始めます')}}else pick(p.from.dataset.lot)}$('shelf').addEventListener('pointerup',release);$('shelf').addEventListener('pointercancel',()=>{pointer=null;stroke.setAttribute('opacity','0')});
$('download').onclick=()=>{const d={lab:'ambertime-continuous-trade/0.1',mode,month:s.month,ops:s.ops,totalSold:s.totalSold,relations:s.relations,lots:s.lots,log:[...s.log].reverse()};const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='ambertime-trade-lab-log.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};fresh();})();
</script></body></html>
