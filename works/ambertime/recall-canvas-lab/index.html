<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>AmberTime 回想の表示比較 H4-1</title>
<link rel="stylesheet" href="./style.css"><script type="module" src="./lab.mjs"></script>
</head>
<body>
<main class="lab-panel">
 <a href="../recall-lab/">‹ 回想Lab</a>
 <h1>回想の表示比較</h1>
 <div class="lab-options">
  <label>表示幅 <select id="width"><option value="360">360 px</option><option value="320">320 px</option><option value="375">375 px</option><option value="390">390 px</option><option value="430">430 px</option></select></label>
  <label>経路 <select id="mode"><option value="history">過去の回想</option><option value="handover">世代交代</option></select></label>
  <label>開始場面 <select id="example"></select></label>
 </div>
 <div class="lab-actions"><button id="current">現在の表示</button><button id="proposed">新しい表示</button></div>
 <p>同じ一文を、本編の回想部品と新しい情景で比較します。固定サンプルのため、ゲームの進行や保存には接続しません。</p>
 <p>建物は既存地図の切り出し、樽と瓶は本編の共通素材です。瓶は象徴として表示し、当時の外観を再現するものではありません。</p>
 <p id="result" role="status"></p>
 <a href="./REPORT.md">調査と比較結果</a>
</main>
<dialog id="player" aria-labelledby="recall-title">
 <header class="recall-header"><h2 id="recall-title">二代目の回想</h2><button id="close" aria-label="回想を閉じる">×</button></header>
 <button id="picture" aria-label="次の場面へ"><canvas width="120" height="72" aria-hidden="true"></canvas></button>
 <div class="caption" aria-live="polite" aria-atomic="true"><p id="date"></p><p id="sentence"></p></div>
 <nav aria-label="回想の場面"><button id="previous">戻る</button><span id="counter" aria-label="場面番号"></span><button id="next">次へ</button></nav>
</dialog>
<dialog id="baseline-host" aria-label="現在の回想表示"><div class="baseline-bar"><button id="baseline-close">比較に戻る</button></div><iframe id="baseline-frame" title="本編の回想部品・既存スタイル"></iframe></dialog>
</body></html>
