<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#eeece2">
  <title>茶葉がひらく · 試作</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="teaCanvas" aria-label="透明なグラスの中で、一枚の茶葉がゆっくりひらきます。指で水をなぞると葉が揺れます。"></canvas>
  <div id="interface">
    <header><p class="eyebrow">A MOMENT TO STEEP</p><h1>茶葉がひらく</h1><p class="subtitle">ひと葉を待つ、30秒。</p></header>
    <footer>
      <p id="hint">グラスに触れて、お湯を注ぐ</p>
      <p id="clock" aria-label="残り時間">0:30</p>
      <div class="actions">
        <button id="start" type="button">お湯を注ぐ</button>
        <button id="again" type="button" hidden>もう一度</button>
        <button id="sound" type="button" aria-pressed="true" aria-label="終了音を切る">音あり</button>
      </div>
    </footer>
  </div>
  <p id="announce" class="sr-only" role="status" aria-live="polite"></p>
  <script src="../../engine/codea-lite.v1.0.0.js"></script>
  <script data-sse-engine src="../../engine/sukimastock-engine.v0.3.0.js"></script>
  <script src="work-config.js"></script>
  <script src="model.js"></script>
  <script src="sketch.js"></script>
  <script>CodeaLite.start('teaCanvas');</script>
</body>
</html>
