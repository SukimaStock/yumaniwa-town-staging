<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,follow"><meta name="theme-color" content="#e8e5dc"><meta name="description" content="前に打った玉と協力する、三球のビリヤードパズル。"><title>あとだま</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app"><header><button id="levelsButton" aria-label="ステージを選ぶ" class="brand">あとだま<span class="brand-dot"></span></button><div id="levelTitle">01 / 06</div><button id="sound" class="icon" aria-label="音を入れる" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4m13 0 4 6m0-6-4 6"/></svg></button><button id="help" class="icon" aria-label="遊び方">?</button></header>
<section id="play"><div id="boardWrap"><canvas id="board" width="720" height="1000" tabindex="0" aria-label="ビリヤード盤。オレンジの玉を引いて離して発射。キーボードでは左右で向き、上下で強さを変え、Enterで発射。"></canvas><div id="result" hidden><div class="result-inner"><div id="resultSmall">TABLE 01</div><h1 id="resultTitle">CLEAR</h1><p id="resultDetail"></p><div id="resultOrbs"></div><button id="next" class="primary">次のテーブル<span>→</span></button><button id="again" class="quiet">もう一度</button></div></div></div></section>
<section id="controls"><div class="status-row"><div id="tracks" aria-label="三球の記録"></div><div id="targets">0 / 3</div></div><div id="timeline"><i></i></div><div class="hint-row"><p id="hint" role="status">玉を引っぱって離す</p><button id="fast" hidden>早送り ×2</button></div><nav><button id="undo" disabled><span>↶</span> 一球戻す</button><button id="reset"><span>⟲</span> やり直す</button><button id="preview" disabled><span>▷</span> 再生</button></nav></section>
<dialog id="modal"><div id="modalBody"></div><button id="close" class="primary">閉じる</button></dialog><footer><span id="tableName">まず一球</span><span id="bestScore">ベスト —</span></footer></main><script type="module" src="app.mjs"></script></body></html>
