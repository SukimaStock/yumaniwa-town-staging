<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ebe8e2">
  <title>Diorama Calendar — Showcase</title>
  <style>
    :root {
      color-scheme: light;
      --page: #ebe8e2;
      --phone: #171717;
      --screen: #f7f5ef;
      --shadow: rgba(41, 37, 32, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--page);
    }

    body {
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      perspective: 1400px;
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      width: min(74vw, 720px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.72) 0%,
        rgba(255, 255, 255, 0.24) 42%,
        rgba(255, 255, 255, 0) 72%
      );
      transform: translateY(-1.5vh);
      pointer-events: none;
      z-index: -1;
    }

    .phone {
      position: relative;
      width: min(72vw, 390px, calc(82vh * 0.57576));
      aspect-ratio: 380 / 660;
      padding: 10px;
      border-radius: 46px;
      background: var(--phone);
      box-shadow:
        0 28px 60px var(--shadow),
        0 7px 18px rgba(41, 37, 32, 0.12);
      transform-style: preserve-3d;
      will-change: transform;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 36px;
      background: var(--screen);
    }

    .screen iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--screen);
    }

    .island {
      position: absolute;
      z-index: 3;
      top: 12px;
      left: 50%;
      width: 28%;
      height: 22px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #0d0d0d;
      pointer-events: none;
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.04);
    }

    @media (max-height: 700px) {
      .phone {
        width: min(66vw, calc(88vh * 0.57576));
        border-radius: 38px;
        padding: 8px;
      }

      .screen {
        border-radius: 30px;
      }

      .island {
        top: 10px;
        height: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Diorama Calendar showcase">
    <div class="phone" id="showcasePhone">
      <div class="screen">
        <iframe
          id="showcaseFrame"
          src="index.html?showcase=1&showcaseVersion=4"
          title="Diorama Calendar"
          loading="eager"
        ></iframe>
        <div class="island" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      const phone = document.getElementById("showcasePhone");
      const frame = document.getElementById("showcaseFrame");
      const start = performance.now();

      const MOTION = {
        period: 3.00,
        monthTriggerProgress: 0.32,
        tiltX: 0.90,
        tiltY: 0.025,
      };
      const cycleDuration = MOTION.period;
      const monthTriggerAt =
        cycleDuration * (0.75 + 0.25 * MOTION.monthTriggerProgress);

      function motionAt(seconds) {
        const local = ((seconds % cycleDuration) + cycleDuration) % cycleDuration;
        const phase = (local / cycleDuration) * Math.PI * 2;

        // Continuous motion through center: no easing pause between cycles.
        const x = -Math.sin(phase) * MOTION.tiltX;
        const y = Math.sin(phase * 2) * MOTION.tiltY;

        // Change month while returning from the right edge toward center.
        const monthCycle = seconds < monthTriggerAt
          ? 0
          : Math.floor((seconds - monthTriggerAt) / cycleDuration) + 1;

        return { x, y, monthCycle };
      }

      function tick(now) {
        const t = Math.max(0, (now - start) / 1000);
        const motion = motionAt(t);

        // Stronger than v1, but still within a believable handheld tilt.
        const rotateY = motion.x * 5.6;
        const rotateX = -motion.y * 4.0;

        phone.style.transform =
          "rotateX(" + rotateX.toFixed(3) + "deg) " +
          "rotateY(" + rotateY.toFixed(3) + "deg)";

        try {
          if (frame.contentWindow) {
            frame.contentWindow.DIORAMA_SHOWCASE_INPUT = motion;
          }
        } catch (_) {
          // Same-origin in production. If access is unavailable, the embedded
          // app mirrors this same sequence as its fallback showcase motion.
        }

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
