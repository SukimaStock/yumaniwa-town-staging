<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>器と食卓 — 組合せの比較</title><style>body{font:13px system-ui;background:#f5f2e9;color:#38433f;margin:16px}nav{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:14px}a{color:inherit;text-underline-offset:3px}main{max-width:960px;margin-inline:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}figure{margin:0}img{width:100%;height:auto;display:block}figcaption{font-size:12px;margin:6px 0 0}@media(max-width:600px){main{grid-template-columns:1fr 1fr}}</style><nav id="palettes"><a href="../">作品へ戻る</a></nav><nav id="textures"></nav><main id="grid"></main><script type="module">
import {generateScene,DRINKS,FRUITS,TABLE_PALETTES} from '../engine.mjs?variants=03';import {renderSVG} from '../renderer.mjs?variants=03';
const query=new URL(location.href).searchParams,palette=query.get('palette')||'cream',texture=query.get('texture')||'original';
for(const [id,p]of Object.entries(TABLE_PALETTES)){const a=document.createElement('a');a.href='?'+new URLSearchParams({palette:id,texture});a.textContent=p.name;document.querySelector('#palettes').append(a);}
for(const [id,name]of [['original','原画'],['print','印刷風'],['watercolor','水彩画風']]){const a=document.createElement('a');a.href='?'+new URLSearchParams({palette,texture:id});a.textContent=name;document.querySelector('#textures').append(a);}
const urls=[];for(const drink of DRINKS)for(const fruit of FRUITS){const scene=generateScene({version:3,drink:drink.id,fruit:fruit.id,palette,texture}),figure=document.createElement('figure'),a=document.createElement('a'),img=document.createElement('img'),cap=document.createElement('figcaption');const url=URL.createObjectURL(new Blob([renderSVG(scene)],{type:'image/svg+xml'}));urls.push(url);img.src=url;img.alt=scene.title;img.width=900;img.height=720;a.href='../?'+new URLSearchParams(scene.settings);a.append(img);cap.textContent=scene.title;figure.append(a,cap);document.querySelector('#grid').append(figure);}addEventListener('pagehide',()=>urls.forEach(URL.revokeObjectURL));addEventListener('pageshow',e=>{if(e.persisted)location.reload();});
</script></html>
