<!doctype html><html lang="ja"><meta charset="utf-8"><title>食卓の比較</title><style>body{font:14px system-ui;background:#f5f2e9;margin:16px}nav{position:sticky;top:0;background:#f5f2e9;padding:12px}main{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}img{width:100%;display:block}figure{margin:0}figcaption{font-size:11px}#mobile{display:flex;align-items:start;gap:10px}iframe{height:1000px;border:1px solid gray;flex-shrink:0}</style><nav><a href="?view=seeds">36 seeds</a> · <a href="?view=top">真上18枚</a> · <a href="?view=side">横18枚</a> · <a href="?view=finishes">質感比較</a> · <a href="?view=mobile">360 / 375 / 390</a> · <a href="../">作品へ戻る</a></nav><main id="grid"></main><div id="mobile"></div><script type="module">
import {generateScene} from '../engine.mjs';import {renderSVG} from '../renderer.mjs';
const view=new URL(location.href).searchParams.get('view')||'seeds';
if(view==='mobile'){document.querySelector('main').remove();for(const width of [360,375,390]){let frame=document.createElement('iframe');frame.width=width;frame.title=width+'px';frame.src='../?seed=review-01';document.querySelector('#mobile').append(frame)}}else{const palettes=['cream','teal','rust','olive','blue'];let i=0;for(const composition of (view==='top'?['top']:view==='side'?['side']:['top','side']))for(let j=1;j<=18;j++){if(view==='finishes'&&j>3)continue;for(const texture of view==='finishes'?['original','print','watercolor']:['original']){const s={seed:'review-'+String(j+(composition==='side'?18:0)).padStart(2,'0'),composition,palette:palettes[(j-1)%5],density:['few','normal','many'][(j-1)%3],texture};const f=document.createElement('figure'),img=document.createElement('img'),cap=document.createElement('figcaption');img.alt=[s.seed,composition,texture].join(' ');img.src=URL.createObjectURL(new Blob([renderSVG(generateScene(s))],{type:'image/svg+xml'}));cap.textContent=[composition,s.seed,s.palette,s.density,texture].join(' / ');f.append(img,cap);document.querySelector('#grid').append(f)}}}
</script></html>
